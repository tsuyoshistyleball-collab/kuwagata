<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec850"/>
      <stop offset="1" stop-color="#3f8f2f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a1e"/>
      <stop offset="1" stop-color="#241206"/>
    </linearGradient>
    <linearGradient id="mand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2c14"/>
      <stop offset="1" stop-color="#1a0d04"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- content kept within center safe zone -->
  <g transform="translate(256 268)">
    <!-- legs -->
    <g stroke="#1a0d04" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M-40 -30 L-120 -78 M-46 6 L-132 6 M-40 44 L-120 92"/>
      <path d="M40 -30 L120 -78 M46 6 L132 6 M40 44 L120 92"/>
    </g>
    <!-- abdomen (elytra) -->
    <ellipse cx="0" cy="26" rx="86" ry="112" fill="url(#body)" stroke="#0e0702" stroke-width="8"/>
    <line x1="0" y1="-52" x2="0" y2="132" stroke="#0e0702" stroke-width="7"/>
    <ellipse cx="-30" cy="4" rx="9" ry="16" fill="#7a5230" opacity="0.6"/>
    <ellipse cx="30" cy="4" rx="9" ry="16" fill="#7a5230" opacity="0.6"/>
    <!-- pronotum -->
    <ellipse cx="0" cy="-64" rx="54" ry="40" fill="url(#body)" stroke="#0e0702" stroke-width="8"/>
    <!-- head -->
    <circle cx="0" cy="-108" r="32" fill="url(#body)" stroke="#0e0702" stroke-width="8"/>
    <!-- mandibles (stag beetle) -->
    <g fill="url(#mand)" stroke="#0e0702" stroke-width="6" stroke-linejoin="round">
      <path d="M-20 -128 Q-70 -172 -104 -150 L-92 -132 Q-64 -150 -30 -120 Z"/>
      <path d="M20 -128 Q70 -172 104 -150 L92 -132 Q64 -150 30 -120 Z"/>
    </g>
    <!-- eyes -->
    <circle cx="-13" cy="-112" r="6" fill="#ffd84a"/>
    <circle cx="13" cy="-112" r="6" fill="#ffd84a"/>
  </g>
</svg>

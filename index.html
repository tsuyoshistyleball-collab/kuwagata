function courseSetup() {
  speed = Math.max(W, H) * 0.20;          // 画面サイズに応じたやさしい速度
  const spacing = speed * 3.0;             // 障害物の間隔（約3秒ごと）
  const count = 18;                        // 障害物の数
  goalDist = spacing * (count + 2);

  obstacles = [];
  items = [];
  for (let i = 0; i < count; i++) {
    const x = spacing * (i + 2);
    const type = Math.random() < 0.5 ? 'top' : 'bottom';
    // 障害物の長さ：通れるすき間を画面の55%以上残す
    const h = H * (0.18 + Math.random() * 0.22);
    obstacles.push({ x, type, h, w: Math.max(W, H) * 0.055, passed: false });
    // 障害物の間にアイテムを置く（ときどき「仲間」の虫）
    if (i < count - 1) {
      const ix = x + spacing * 0.5;
      const safeTop = H * 0.2, safeBottom = H * 0.75;
      const iy = safeTop + Math.random() * (safeBottom - safeTop);
      const kind = (i === 3 || i === 8 || i === 13) ? 'friend' : 'jelly';
      items.push({ x: ix, y: iy, taken: false, bob: Math.random() * Math.PI * 2, kind });
    }
  }

  // 道中の敵キャラ（スズメバチ）を配置
  enemies = [];
  for (let k = 0; k < 6; k++) {
    const ex = spacing * (3.4 + k * 2.4);
    const ey = H * (0.22 + Math.random() * 0.42);
    enemies.push({ x: ex, y: ey, baseY: ey, hp: 3, maxHp: 3, fireCd: 1.6 + Math.random() * 1.2, bob: Math.random() * 6, hurt: 0, wing: 0 });
  }

  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({ x: Math.random() * W * 2, y: H * (0.05 + Math.random() * 0.3), s: 0.5 + Math.random() * 0.8 });
  }
  trees = [];
  for (let i = 0; i < 14; i++) {
    trees.push({ x: Math.random() * W * 3, s: 0.6 + Math.random() * 0.7 });
  }
  // 建物（家・灯台・小屋・ロケット）を点々と配置
  houses = [];
  for (let i = 0; i < 5; i++) {
    houses.push({ x: W * (0.6 + i) + Math.random() * W * 0.5, s: 0.8 + Math.random() * 0.5, kind: i % 3 });
  }
  // 宇宙ステージの星
  stars = [];
  for (let i = 0; i < 55; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.82, r: 0.6 + Math.random() * 1.8, tw: Math.random() * 6 });
  }
}

function resetGame() {
  scrollX = 0;
  hearts = MAX_HEARTS;
  jellies = 0;
  exp = 0;
  level = 0;
  expToNext = 3;
  beetle.x = W * 0.24;
  beetle.y = H * 0.45;
  beetle.vy = 0;
  beetle.size = Math.min(W, H) * 0.055;
  beetle.invincible = 0;
  beetle.atkCd = 0;
  beetle.atkCdBase = 0.42;
  beetle.atkAnim = 0;
  beetle.power = 0;
  beetle.weapons = { normal: 1 };
  particles = [];
  confetti = [];
  companions = [];
  enemies = [];
  shots = [];
  levelChoices = [];
  boss.active = false;
  boss.defeated = false;
  bossBanner = 0;
  shake = 0;
  courseSetup();
}

// ---------- 攻撃ボタン（右下） ----------
function attackButton() {
  const r = Math.min(W, H) * 0.1;
  return { x: W - r - Math.min(W, H) * 0.04, y: H - r - Math.min(W, H) * 0.05, r };
}
function inButton(x, y) {
  const b = attackButton();
  const dx = x - b.x, dy = y - b.y;
  return dx * dx + dy * dy <= (b.r * 1.2) * (b.r * 1.2);
}
// ---------- 音楽ボタン（右上） ----------
function musicButton() {
  const r = Math.min(W, H) * 0.05;
  return { x: W - r - Math.min(W, H) * 0.03, y: r + Math.min(W, H) * 0.03, r };
}
function inMusicButton(x, y) {
  const b = musicButton();
  const dx = x - b.x, dy = y - b.y;
  return dx * dx + dy * dy <= (b.r * 1.35) * (b.r * 1.35);
}

// 障害物を壊す（配列インデックス指定）
function smashObstacleIndex(i) {
  const ob = obstacles[i];
  if (!ob) return;
  const sx = ob.x - scrollX;
  const groundY = H * 0.88;
  const cy = ob.type === 'top' ? ob.h * 0.6 : groundY - ob.h * 0.6;
  const col = ob.type === 'top' ? '#5B9E4D' : '#E85D5D';
  burstParticles(sx, cy, col, 18);
  burstParticles(sx, cy, '#FFE0A3', 6);
  obstacles.splice(i, 1);
  sfx.smash();
}
// あるx（画面座標）の前方にある障害物を探す
function findObstacleAhead(fromX, back, reach) {
  for (let i = 0; i < obstacles.length; i++) {
    const sx = obstacles[i].x - scrollX;
    const w = obstacles[i].w;
    if (sx + w / 2 > fromX - back && sx - w / 2 < fromX + reach) return i;
  }
  return -1;
}

// 弾を発射。opts = { angle, kind } でレーザー/爆弾/散弾に対応
function fireShot(x, y, side, dmg, color, pierce, opts) {
  opts = opts || {};
  const kind = opts.kind || 'normal';
  const base = Math.max(W, H) * (side === 'player' ? 0.95 : 0.5);
  let ang = 0, vx, vy = 0;
  if (side === 'player') {
    if (boss.active && !boss.defeated) ang = Math.atan2(boss.y - y, boss.x - x);
    ang += (opts.angle || 0);
    let sp = base;
    if (kind === 'laser') sp = base * 1.9;
    else if (kind === 'bomb') sp = base * 0.55;
    else if (kind === 'flame') sp = base * 0.55;       // 炎は短射程
    vx = Math.cos(ang) * sp; vy = Math.sin(ang) * sp;
    if (kind === 'bomb') vy -= H * 0.32;               // 山なりに投げる
  } else { vx = -base; }
  let r = beetle.size * 0.34;
  if (side === 'player') r = beetle.size * (kind === 'bomb' ? 0.55 : kind === 'laser' ? 0.32 : kind === 'flame' ? 0.5 : 0.4 + Math.min(level, 12) * 0.02);
  shots.push({
    x, y, r, vx, vy, side, dmg,
    color: color || (side === 'player' ? '#FFE873' : '#FF5B6E'),
    spin: 0, pierce: pierce || 1, kind,
    fuse: kind === 'bomb' ? 0.85 : 0,
    life: kind === 'flame' ? 0.34 : 0,                 // 炎は短時間で消える＝短射程
    grow: kind === 'flame' ? 1 + Math.random() * 0.5 : 1,
    flick: Math.random() * 6
  });
  if (side === 'player' && kind !== 'flame') burstParticles(x, y, '#FFF3B0', 4);
}

// 爆発（爆弾）：まわりの敵・障害物・敵弾・ボスにダメージ
function explodeAt(x, y, dmg) {
  const R = Math.min(W, H) * 0.26;
  burstParticles(x, y, '#FF9A3B', 26);
  burstParticles(x, y, '#FFE873', 16);
  shake = Math.max(shake, 0.8);
  sfx.smash();
  if (boss.active && !boss.defeated && boss.introT <= 0) {
    const dx = x - boss.x, dy = y - boss.y;
    if (dx * dx + dy * dy < (R + boss.size) * (R + boss.size)) { boss.hp -= dmg * 3; boss.hurt = 0.2; if (boss.hp <= 0) bossDefeated(); }
  }
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j], ex = e.x - scrollX;
    if ((x - ex) ** 2 + (y - e.y) ** 2 < R * R) { e.hp -= dmg * 2; e.hurt = 0.15; if (e.hp <= 0) { burstParticles(ex, e.y, '#C060E8', 18); enemies.splice(j, 1); } }
  }
  for (let j = obstacles.length - 1; j >= 0; j--) {
    const ob = obstacles[j], sx = ob.x - scrollX;
    const oy = ob.type === 'top' ? ob.h * 0.5 : H * 0.88 - ob.h * 0.5;
    if ((x - sx) ** 2 + (y - oy) ** 2 < R * R) smashObstacleIndex(j);
  }
  for (const o of shots) if (o.side === 'enemy' && (x - o.x) ** 2 + (y - o.y) ** 2 < R * R) o.dead = true;
}

// 1つの武器を、そのレベルに応じて発射（レベルが上がるほど弾が増える）
function fireWeapon(id, lv, ox, oy, dmg) {
  if (id === 'spread') {
    const n = 3 + lv * 2;
    for (let i = 0; i < n; i++) fireShot(ox, oy, 'player', dmg, '#FFD24D', 1, { angle: (i - (n - 1) / 2) * 0.12 });
  } else if (id === 'laser') {
    for (let i = 0; i < lv; i++) fireShot(ox, oy + (i - (lv - 1) / 2) * beetle.size * 0.8, 'player', dmg + 1, '#8AF0FF', 999, { kind: 'laser' });
  } else if (id === 'bomb') {
    const n = Math.min(lv, 3);
    for (let i = 0; i < n; i++) fireShot(ox, oy, 'player', dmg + lv, '#FF9A3B', 1, { kind: 'bomb', angle: (i - (n - 1) / 2) * 0.18 });
  } else if (id === 'flame') {
    // 炎：前方に炎の粒をめらめらと噴き出す（短射程・貫通）
    const n = 4 + lv * 2;
    for (let i = 0; i < n; i++) fireShot(ox, oy, 'player', dmg, '#FF7A2B', 2 + lv, { kind: 'flame', angle: (Math.random() - 0.5) * 0.55 });
    burstParticles(ox, oy, '#FFD24D', 4);
  } else {
    // ノーマル：レベルぶん平行に発射
    for (let i = 0; i < lv; i++) fireShot(ox, oy + (i - (lv - 1) / 2) * beetle.size * 0.7, 'player', dmg, '#FFE873', 1);
  }
}

function doAttack() {
  if (beetle.atkCd > 0) return;
  const bossReady = state === STATE.BOSS && boss.active && !boss.defeated && boss.introT <= 0;
  if (!(state === STATE.PLAY || bossReady)) return;
  beetle.atkCd = beetle.atkCdBase;
  beetle.atkAnim = 0.3;
  const ox = beetle.x + beetle.size * 2, oy = beetle.y;
  const dmg = 1 + Math.floor(level / 2);
  // 持っている武器をすべて同時に発射（消えずに加算されていく）＋それぞれの発射音
  for (const id in beetle.weapons) {
    const lv = beetle.weapons[id];
    if (lv > 0) { fireWeapon(id, lv, ox, oy, dmg); playWeaponSound(id); }
  }
}

// ---------- 入力 ----------
let pointers = new Map();   // id -> 'fly' | 'atk'
function refreshPressing() {
  pressing = [...pointers.values()].includes('fly');
}
// タイトル/結果画面 → ステージ選択へ
function tryStart() {
  if (state === STATE.TITLE || state === STATE.GOAL || state === STATE.RETRY) {
    if (stateTimer > 0.6) { state = STATE.STAGESELECT; stateTimer = 0; Music.stop(); }
    return true;
  }
  return false;
}
function startStage(idx) {
  stageIndex = idx;
  resetGame();
  state = STATE.PLAY;
  stateTimer = 0;
  sfx.start();
  Music.start('main');
}
// n枚のカードの配置（枚数に合わせてサイズを自動調整）
function cardRects(n) {
  const rects = [];
  const landscape = W > H * 1.15;
  if (landscape) {
    const gap = W * 0.02;
    const cw = Math.min(H * 0.66, (W * 0.94 - gap * (n - 1)) / n), ch = H * 0.52, y = H * 0.34;
    const total = n * cw + (n - 1) * gap, x0 = (W - total) / 2;
    for (let i = 0; i < n; i++) rects.push({ x: x0 + i * (cw + gap), y, w: cw, h: ch });
  } else {
    const cw = W * 0.74, gap = H * 0.02;
    const areaTop = H * 0.3, areaBot = H * 0.9;
    const ch = Math.min(H * 0.15, (areaBot - areaTop - gap * (n - 1)) / n);
    const total = n * ch + (n - 1) * gap, x = (W - cw) / 2, y0 = areaTop + ((areaBot - areaTop) - total) / 2;
    for (let i = 0; i < n; i++) rects.push({ x, y: y0 + i * (ch + gap), w: cw, h: ch });
  }
  return rects;
}
function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
function stageCardAt(x, y) { const r = cardRects(STAGES.length); for (let i = 0; i < r.length; i++) if (inRect(x, y, r[i])) return i; return -1; }
function levelChoiceAt(x, y) { const r = cardRects(levelChoices.length); for (let i = 0; i < r.length; i++) if (inRect(x, y, r[i])) return levelChoices[i]; return null; }

function pointerDown(id, x, y) {
  initAudio();
  // ステージ選択：カードをタップ
  if (state === STATE.STAGESELECT) {
    if (stateTimer > 0.4) { const i = stageCardAt(x, y); if (i >= 0) startStage(i); }
    return;
  }
  // パワーアップの3択
  if (state === STATE.LEVELUP) {
    if (stateTimer > 0.3) { const c = levelChoiceAt(x, y); if (c) applyUpgrade(c); }
    return;
  }
  if (inMusicButton(x, y)) { Music.toggle(); return; }   // 音楽ON/OFF
  if (tryStart()) return;             // タイトル等はどこを押しても次へ
  if (inButton(x, y)) {
    pointers.set(id, 'atk');
    doAttack();
  } else {
    pointers.set(id, 'fly');
    refreshPressing();
  }
}
function pointerUp(id) {
  pointers.delete(id);
  refreshPressing();
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) pointerDown(t.identifier, t.clientX, t.clientY);
}, { passive: false });
function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) pointerUp(t.identifier);
}
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });
canvas.addEventListener('mousedown', (e) => pointerDown('mouse', e.clientX, e.clientY));
window.addEventListener('mouseup', () => pointerUp('mouse'));
// キーボード：スペース/↑で飛行、X/Enterで攻撃
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (!tryStart()) { pointers.set('key', 'fly'); refreshPressing(); }
  } else if (e.code === 'KeyX' || e.code === 'Enter') {
    if (!tryStart()) doAttack();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') pointerUp('key');
});
function attackHeld() { return [...pointers.values()].includes('atk'); }

// ---------- 更新 ----------
function update(dt) {
  stateTimer += dt;
  beetle.wingPhase += dt * (pressing ? 40 : 18);

  if (state === STATE.BOSS) { updateBoss(dt); return; }

  // レベルアップ中は完全に一時停止／ステージ選択も世界を止める
  if (state === STATE.LEVELUP || state === STATE.STAGESELECT) { updateParticles(dt); return; }

  if (state !== STATE.PLAY) {
    // タイトル画面などではふわふわ浮かぶ
    beetle.y = H * 0.42 + Math.sin(stateTimer * 2) * H * 0.02;
    updateDecor(dt, 0.3);
    updateParticles(dt);
    updateConfetti(dt);
    return;
  }

  // 飛行の物理：押している間は上昇、離すと下降
  const up = H * 1.15;      // 上昇加速度
  const gravity = H * 0.95; // 重力
  if (pressing) beetle.vy -= up * dt;
  else beetle.vy += gravity * dt;
  const vmax = H * 0.55;
  beetle.vy = Math.max(-vmax, Math.min(vmax, beetle.vy));
  beetle.y += beetle.vy * dt;
  beetle.tilt = beetle.vy / vmax * 0.4;

  // 画面の上下では止まる（落ちてもミスにならない・やさしい設計）
  const groundY = H * 0.88;
  if (beetle.y < beetle.size * 1.2) { beetle.y = beetle.size * 1.2; beetle.vy = Math.max(0, beetle.vy); }
  if (beetle.y > groundY - beetle.size) { beetle.y = groundY - beetle.size; beetle.vy = Math.min(0, beetle.vy); }

  // スクロール
  scrollX += speed * dt;
  updateDecor(dt, 1);

  if (beetle.invincible > 0) beetle.invincible -= dt;
  if (beetle.atkCd > 0) beetle.atkCd -= dt;
  if (beetle.atkAnim > 0) beetle.atkAnim -= dt;
  if (shake > 0) shake -= dt * 3;

  // 攻撃ボタンを押しっぱなしにすると連続で攻撃
  if (attackHeld() && beetle.atkCd <= 0) doAttack();

  updateCompanions(dt);
  updateEnemies(dt);
  updateShots(dt);

  // 飛行のキラキラ
  if (pressing && Math.random() < 0.3) {
    particles.push({
      x: beetle.x - beetle.size, y: beetle.y + beetle.size * 0.5,
      vx: -60 - Math.random() * 60, vy: 30 + Math.random() * 50,
      life: 0.5, maxLife: 0.5, color: '#FFF8B0', r: 3 + Math.random() * 3
    });
  }

  // ※ 障害物に当たってもダメージは受けない（壊す対象）

  // ゼリー取得
  for (const it of items) {
    if (it.taken) continue;
    it.bob += dt * 3;
    const sx = it.x - scrollX;
    if (sx < -50 || sx > W + 50) continue;
    const iy = it.y + Math.sin(it.bob) * 8;
    const dx = beetle.x - sx, dy = beetle.y - iy;
    const r = beetle.size + Math.min(W, H) * 0.035;
    if (dx * dx + dy * dy < r * r) {
      it.taken = true;
      if (it.kind === 'friend') {
        addCompanion();                         // 仲間が参戦！
        sfx.powerup();
        burstParticles(sx, iy, '#8BD1FF', 18);
        burstParticles(beetle.x, beetle.y, '#FFFFFF', 12);
      } else {
        jellies++;
        exp++;                                   // ゼリーで経験値がたまる
        sfx.collect();
        burstParticles(sx, iy, '#FFB84D', 14);
        if (exp >= expToNext) triggerLevelUp();  // たまったらパワーアップ（一時停止）
      }
    }
  }

  // ゴールに到達 → ボスステージへ
  if (scrollX >= goalDist) {
    startBoss();
  }

  updateParticles(dt);
}

// ---------- パワーアップ（レベルアップ） ----------
function pickUpgrades(n) {
  let pool = UPGRADES.filter(u => {
    // 武器は何度でも選べる（選ぶたびに加算・強化される）
    if (u.id === 'friend' && companions.length >= MAX_COMPANIONS) return false;
    if (u.id === 'heal' && hearts >= MAX_HEARTS) return false;
    return true;
  }).slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const res = pool.slice(0, n);
  for (let k = 0; res.length < n && k < UPGRADES.length; k++) if (!res.includes(UPGRADES[k])) res.push(UPGRADES[k]);
  return res;
}
function triggerLevelUp() {
  exp -= expToNext;
  expToNext += 1;
  level++;
  beetle.power = level;              // 見た目のオーラ／金色に反映
  levelChoices = pickUpgrades(3);
  state = STATE.LEVELUP;             // ゲームを一時停止して3択
  stateTimer = 0;
  sfx.powerup();
}
function applyUpgrade(u) {
  if (u.weapon) beetle.weapons[u.id] = (beetle.weapons[u.id] || 0) + 1;   // 武器を加算
  else if (u.id === 'friend') addCompanion();
  else if (u.id === 'heal') hearts = Math.min(MAX_HEARTS, hearts + 2);
  levelChoices = [];
  state = STATE.PLAY;                // 再開
  stateTimer = 0;
  beetle.atkCd = 0.2;
  sfx.start();
  burstParticles(beetle.x, beetle.y, '#FFE873', 20);
}

// ---------- 仲間の虫 ----------
function addCompanion() {
  if (companions.length >= MAX_COMPANIONS) return;   // 仲間は最大4匹
  // 1人目＝バッタ、2人目＝カマキリ、以降テントウムシ・ハチ
  const types = ['grasshopper', 'mantis', 'ladybug', 'bee'];
  const i = companions.length;
  companions.push({
    type: types[i % types.length],
    x: beetle.x, y: beetle.y,
    idx: i, atkCd: 0.6 + Math.random() * 0.6, t: Math.random() * Math.PI * 2, wing: 0
  });
}
function updateCompanions(dt) {
  const n = companions.length;
  for (const c of companions) {
    c.t += dt;
    c.wing += dt * 30;
    // クワガタの周りをまわる
    const ang = c.t * 1.5 + c.idx * (Math.PI * 2 / Math.max(1, n));
    const rad = beetle.size * (2.3 + (c.idx % 3) * 0.55);
    const tx = beetle.x - beetle.size * 0.5 + Math.cos(ang) * rad;
    const ty = beetle.y + Math.sin(ang) * rad * 0.7;
    c.x += (tx - c.x) * Math.min(1, dt * 8);
    c.y += (ty - c.y) * Math.min(1, dt * 8);

    c.atkCd -= dt;
    if (c.atkCd <= 0) {
      // 通常ステージもボスステージも同じ仕様：仲間も前方へ弾を撃つ
      const bossNotReady = state === STATE.BOSS && (!boss.active || boss.defeated || boss.introT > 0);
      if (bossNotReady) {
        c.atkCd = 0.4;   // ボス登場前は撃たない
      } else {
        // 仲間の攻撃を強化：威力アップ・貫通・連射を速く
        const cdmg = 3 + Math.floor(level / 2);
        fireShot(c.x, c.y, 'player', cdmg, '#FF8A5B', 2);
        c.atkCd = 0.7;
      }
    }
  }
}

// ---------- ボスステージ ----------
function startBoss() {
  state = STATE.BOSS;
  stateTimer = 0;
  bossBanner = 2.2;
  boss.active = true;
  boss.defeated = false;
  boss.size = Math.min(W, H) * 0.17;
  boss.maxHp = 260;
  boss.hp = 260;
  boss.x = W + boss.size;
  boss.y = H * 0.42;
  boss.introT = 1.6;
  boss.fireCd = 2.2;
  boss.bob = 0;
  boss.hurt = 0;
  shots = [];
  enemies = [];
  beetle.x = W * 0.16;
  beetle.vy = 0;
  beetle.invincible = 1.2;
  Music.start('boss');
}
function bossDefeated() {
  boss.defeated = true;
  boss.hp = 0;
  state = STATE.GOAL;
  stateTimer = 0;
  Music.stop();
  sfx.goal();
  for (let i = 0; i < 120; i++) spawnConfetti();
  burstParticles(boss.x, boss.y, '#FFE873', 40);
  burstParticles(boss.x, boss.y, '#FF9A5B', 30);
}
function bossFire() {
  const bx = boss.x - boss.size * 0.55, by = boss.y;
  const ang = Math.atan2(beetle.y - by, beetle.x - bx);
  const sp = Math.max(W, H) * 0.42;
  for (const off of [-0.2, 0, 0.2]) {
    const a = ang + off;
    shots.push({ x: bx, y: by, r: boss.size * 0.13, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, side: 'enemy', dmg: 1, color: '#FF5B6E', spin: 0, pierce: 1 });
  }
  sfx.attack();
}

// プレイヤーがダメージを受ける（敵の攻撃・敵との接触）
function damagePlayer() {
  if (beetle.invincible > 0) return;
  hearts--;
  beetle.invincible = 1.6;
  shake = 1;
  sfx.hit();
  burstParticles(beetle.x, beetle.y, '#FF8888', 12);
  if (hearts <= 0) { state = STATE.RETRY; stateTimer = 0; Music.stop(); }
}

// ---------- 道中の敵 ----------
function enemyFire(sx, ey) {
  const ang = Math.atan2(beetle.y - ey, beetle.x - sx);
  const sp = Math.max(W, H) * 0.38;
  shots.push({ x: sx, y: ey, r: beetle.size * 0.34, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, side: 'enemy', dmg: 1, color: '#C060E8', spin: 0, pierce: 1 });
  sfx.attack();
}
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const sx = e.x - scrollX;
    e.wing += dt * 30;
    if (e.hurt > 0) e.hurt -= dt;
    if (sx < -H * 0.25) { enemies.splice(i, 1); continue; }   // 画面左に流れて退場
    if (sx > W + H * 0.2) continue;                            // まだ右で登場前
    e.bob += dt;
    e.y = e.baseY + Math.sin(e.bob * 1.4) * H * 0.06;
    // 画面内かつプレイヤーより前（右）にいるとき攻撃
    if (sx < W * 0.96 && sx > beetle.x - beetle.size) {
      e.fireCd -= dt;
      if (e.fireCd <= 0) { enemyFire(sx, e.y); e.fireCd = 2.0 + Math.random() * 0.9; }
    }
    // 接触ダメージ
    const dx = beetle.x - sx, dy = beetle.y - e.y;
    const rr = beetle.size * 0.6 + Math.min(W, H) * 0.045;
    if (dx * dx + dy * dy < rr * rr) damagePlayer();
  }
}

function updateShots(dt) {
  const groundY = H * 0.88;
  // 移動＆画面外判定（爆弾は山なり＆時限式）
  for (const s of shots) {
    if (s.kind === 'bomb') { s.vy += H * 0.9 * dt; s.fuse -= dt; }
    if (s.kind === 'flame') { s.life -= dt; s.grow += dt * 2.5; if (s.life <= 0) s.dead = true; }   // 炎は短時間で消える
    s.x += s.vx * dt; s.y += s.vy * dt; s.spin += dt * 12;
    if (s.x < -80 || s.x > W + 80 || s.y < -80 || s.y > H + 80) s.dead = true;
  }
  for (const s of shots) {
    if (s.dead) continue;
    if (s.side === 'player') {
      // 爆弾：時間切れか着地で爆発（個別の当たり判定はしない）
      if (s.kind === 'bomb') {
        if (s.fuse <= 0 || s.y >= groundY) { explodeAt(s.x, s.y, s.dmg); s.dead = true; }
        continue;
      }
      // 敵の弾を打ち消す
      for (const o of shots) {
        if (o === s || o.dead || o.side === 'player') continue;
        const dx = s.x - o.x, dy = s.y - o.y, rr = s.r + o.r;
        if (dx * dx + dy * dy < rr * rr) {
          o.dead = true;
          burstParticles((s.x + o.x) / 2, (s.y + o.y) / 2, '#FFFFFF', 8);
          if (s.kind !== 'laser') { s.dead = true; break; }   // レーザーは打ち消しても消えない
        }
      }
      if (s.dead) continue;
      // ボスに当たる（縦長判定で当てやすく）
      if (boss.active && !boss.defeated && boss.introT <= 0) {
        const dx = (s.x - boss.x) / (boss.size * 1.0);
        const dy = (s.y - boss.y) / (boss.size * 1.25);
        if (dx * dx + dy * dy < 1) {
          boss.hp -= s.dmg; boss.hurt = 0.16; sfx.smash();
          burstParticles(s.x, s.y, '#FFE873', 10);
          s.dead = true;
          if (boss.hp <= 0) bossDefeated();
          continue;
        }
      }
      // 敵に当たる（貫通ぶんだけ倒せる）
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j], ex = e.x - scrollX;
        const dx = s.x - ex, dy = s.y - e.y, rr = Math.min(W, H) * 0.05 + s.r;
        if (dx * dx + dy * dy < rr * rr) {
          e.hp -= s.dmg; e.hurt = 0.15;
          burstParticles(s.x, s.y, '#FFE873', 8);
          if (e.hp <= 0) { burstParticles(ex, e.y, '#C060E8', 20); sfx.smash(); enemies.splice(j, 1); }
          s.pierce--;
          if (s.pierce <= 0) { s.dead = true; break; }
        }
      }
      if (s.dead) continue;
      // 障害物に当たったら壊す（強化で複数貫通）
      for (let j = obstacles.length - 1; j >= 0; j--) {
        const ob = obstacles[j];
        const sx = ob.x - scrollX;
        const oy0 = ob.type === 'top' ? 0 : groundY - ob.h;
        const oy1 = ob.type === 'top' ? ob.h : groundY;
        if (s.x > sx - ob.w / 2 - s.r && s.x < sx + ob.w / 2 + s.r &&
            s.y > oy0 - s.r && s.y < oy1 + s.r) {
          smashObstacleIndex(j);
          shake = Math.max(shake, 0.4);
          s.pierce--;
          if (s.pierce <= 0) { s.dead = true; break; }
        }
      }
    } else {
      // 敵の弾：プレイヤーに当たる
      const dx = s.x - beetle.x, dy = s.y - beetle.y;
      const rr = beetle.size * 0.6 + s.r;
      if (dx * dx + dy * dy < rr * rr) { damagePlayer(); s.dead = true; }
    }
  }
  // 死んだ弾を除去
  for (let i = shots.length - 1; i >= 0; i--) if (shots[i].dead) shots.splice(i, 1);
}
function updateBoss(dt) {
  // 飛行（上下移動のみ・スクロールなし）
  const up = H * 1.15, gravity = H * 0.95, vmax = H * 0.55;
  if (pressing) beetle.vy -= up * dt; else beetle.vy += gravity * dt;
  beetle.vy = Math.max(-vmax, Math.min(vmax, beetle.vy));
  beetle.y += beetle.vy * dt;
  beetle.tilt = beetle.vy / vmax * 0.4;
  const groundY = H * 0.88;
  if (beetle.y < beetle.size * 1.2) { beetle.y = beetle.size * 1.2; beetle.vy = Math.max(0, beetle.vy); }
  if (beetle.y > groundY - beetle.size) { beetle.y = groundY - beetle.size; beetle.vy = Math.min(0, beetle.vy); }

  if (beetle.invincible > 0) beetle.invincible -= dt;
  if (beetle.atkCd > 0) beetle.atkCd -= dt;
  if (beetle.atkAnim > 0) beetle.atkAnim -= dt;
  if (shake > 0) shake -= dt * 3;
  if (boss.hurt > 0) boss.hurt -= dt;
  if (bossBanner > 0) bossBanner -= dt;

  if (boss.introT > 0) {
    boss.introT -= dt;
    boss.x += (W * 0.8 - boss.x) * Math.min(1, dt * 3);
  } else if (!boss.defeated) {
    boss.bob += dt;
    boss.y = H * 0.42 + Math.sin(boss.bob * 1.2) * H * 0.14;
    boss.x = W * 0.8 + Math.sin(boss.bob * 0.6) * W * 0.02;
    boss.fireCd -= dt;
    if (boss.fireCd <= 0) {
      bossFire();
      // HPが減るほど攻撃が激しくなる
      boss.fireCd = 1.5 - (1 - boss.hp / boss.maxHp) * 0.7;
    }
  }

  if (attackHeld() && beetle.atkCd <= 0) doAttack();

  updateCompanions(dt);
  updateShots(dt);
  updateDecor(dt, 0.12);
  updateParticles(dt);
  updateConfetti(dt);

  if (pressing && Math.random() < 0.3) {
    particles.push({ x: beetle.x - beetle.size, y: beetle.y + beetle.size * 0.5, vx: -70, vy: 40, life: 0.5, maxLife: 0.5, color: '#FFF8B0', r: 3 });
  }
}

function updateDecor(dt, mul) {
  for (const c of clouds) {
    c.x -= speed * 0.15 * c.s * dt * mul;
    if (c.x < -200) { c.x = W + 200; c.y = H * (0.05 + Math.random() * 0.3); }
  }
  for (const t of trees) {
    t.x -= speed * 0.45 * t.s * dt * mul;
    if (t.x < -150) { t.x = W + 150 + Math.random() * 200; }
  }
  for (const hs of houses) {
    hs.x -= speed * 0.5 * hs.s * dt * mul;
    if (hs.x < -W * 0.3) { hs.x = W + W * 0.2 + Math.random() * W * 0.7; }
  }
  for (const st of stars) {
    st.x -= speed * 0.1 * dt * mul;
    if (st.x < 0) st.x += W;
    st.tw += dt * 3;
  }
}

function burstParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 180;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.6, maxLife: 0.6, color, r: 3 + Math.random() * 4
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function spawnConfetti() {
  confetti.push({
    x: Math.random() * W, y: -20 - Math.random() * H,
    vy: 80 + Math.random() * 120, vx: -40 + Math.random() * 80,
    r: 4 + Math.random() * 6, rot: Math.random() * Math.PI * 2, vr: -4 + Math.random() * 8,
    color: ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF9F45', '#C780FA'][Math.floor(Math.random() * 6)]
  });
}
function updateConfetti(dt) {
  for (const c of confetti) {
    c.y += c.vy * dt;
    c.x += c.vx * dt + Math.sin(c.y * 0.02) * 1.5;
    c.rot += c.vr * dt;
    if (c.y > H + 20) { c.y = -20; c.x = Math.random() * W; }
  }
}

// ---------- 描画 ----------
function draw() {
  // ステージ選択は専用画面
  if (state === STATE.STAGESELECT) { drawStageSelect(); return; }

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);
  }

  drawBackground();
  if (state === STATE.BOSS) {
    drawBoss();
    drawShots();
    drawParticles();
    drawCompanions();
    drawBeetle();
  } else {
    drawObstacles();
    drawItems();
    drawGoalFlag();
    drawEnemies();
    drawShots();
    drawParticles();
    drawCompanions();
    drawBeetle();
  }
  drawHUD();
  drawAttackButton();
  drawMusicButton();

  ctx.restore();

  if (state === STATE.TITLE) drawTitle();
  else if (state === STATE.GOAL) drawGoal();
  else if (state === STATE.RETRY) drawRetry();
  else if (state === STATE.LEVELUP) drawLevelUp();
  if (state === STATE.BOSS && bossBanner > 0) drawBossBanner();

  drawConfettiLayer();
}

// ---------- カード共通描画 ----------
function drawCard(r, accent, selected) {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  roundRect(r.x + 3, r.y + 5, r.w, r.h, r.h * 0.16); ctx.fill();
  ctx.fillStyle = '#FFFDF7';
  roundRect(r.x, r.y, r.w, r.h, r.h * 0.16); ctx.fill();
  ctx.strokeStyle = accent; ctx.lineWidth = Math.min(W, H) * 0.008;
  roundRect(r.x, r.y, r.w, r.h, r.h * 0.16); ctx.stroke();
}
function drawStageSelect() {
  const base = Math.min(W, H);
  // 背景（やさしいグラデーション）
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8FD3F0'); g.addColorStop(1, '#E8F4E8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  bigText('ステージを えらんでね', H * 0.16, base * 0.07, '#5C3317', '#FFF');

  const rects = cardRects(STAGES.length);
  const landscape = W > H * 1.15;
  for (let i = 0; i < STAGES.length; i++) {
    const st = STAGES[i], r = rects[i];
    drawCard(r, '#4D96FF');
    // ステージの色プレビュー
    const pv = { x: r.x + r.w * 0.08, y: r.y + r.h * 0.16, w: r.w * 0.84, h: r.h * (landscape ? 0.42 : 0.44) };
    const sg = ctx.createLinearGradient(0, pv.y, 0, pv.y + pv.h);
    sg.addColorStop(0, st.sky[0]); sg.addColorStop(1, st.sky[2]);
    ctx.fillStyle = sg; roundRect(pv.x, pv.y, pv.w, pv.h, pv.h * 0.15); ctx.fill();
    ctx.fillStyle = st.ground; ctx.fillRect(pv.x, pv.y + pv.h * 0.74, pv.w, pv.h * 0.26);
    ctx.save(); roundRect(pv.x, pv.y, pv.w, pv.h, pv.h * 0.15); ctx.clip();
    ctx.fillStyle = st.ground2; ctx.fillRect(pv.x, pv.y + pv.h * 0.74, pv.w, pv.h * 0.26); ctx.restore();
    ctx.font = `${r.h * 0.34}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(st.emoji, r.x + r.w / 2, pv.y + pv.h * 0.5);
    // 名前
    ctx.fillStyle = '#5C3317';
    ctx.font = `bold ${r.h * 0.22}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
    ctx.fillText(st.name, r.x + r.w / 2, r.y + r.h * (landscape ? 0.8 : 0.78));
  }
  if (stateTimer > 0.4) bigText('タップで スタート！', H * 0.93, base * 0.045, '#FFF', '#E8743B');
}
function drawLevelUp() {
  overlay(0.45);
  const base = Math.min(W, H);
  ctx.save();
  ctx.translate(W / 2, H * 0.2); ctx.scale(pulse(), pulse()); ctx.translate(-W / 2, -H * 0.2);
  bigText('パワーアップ！', H * 0.2, base * 0.09, '#FFD93D', '#B8860B');
  ctx.restore();
  bigText('ひとつ えらんでね', H * 0.29, base * 0.05, '#FFF', '#5C3317');
  const rects = cardRects(levelChoices.length);
  const landscape = W > H * 1.15;
  for (let i = 0; i < levelChoices.length; i++) {
    const u = levelChoices[i], r = rects[i];
    drawCard(r, u.weapon ? '#E8433B' : '#4D96FF');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${r.h * (landscape ? 0.34 : 0.5)}px sans-serif`;
    ctx.fillText(u.icon, landscape ? r.x + r.w / 2 : r.x + r.w * 0.18, landscape ? r.y + r.h * 0.34 : r.y + r.h / 2);
    ctx.fillStyle = '#5C3317';
    ctx.font = `bold ${r.h * (landscape ? 0.2 : 0.26)}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
    ctx.textAlign = landscape ? 'center' : 'left';
    const tx = landscape ? r.x + r.w / 2 : r.x + r.w * 0.34;
    ctx.fillText(u.name, tx, landscape ? r.y + r.h * 0.64 : r.y + r.h * 0.38);
    ctx.fillStyle = '#8A6A4A';
    ctx.font = `${r.h * (landscape ? 0.14 : 0.16)}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
    ctx.fillText(u.desc, tx, landscape ? r.y + r.h * 0.82 : r.y + r.h * 0.66);
  }
}

function drawBackground() {
  const bossArena = (state === STATE.BOSS);
  const stg = STAGES[stageIndex];
  const groundY = H * 0.88;

  // 空（ボス戦は夕暮れ、ふだんはステージごとの色）
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  if (bossArena) {
    sky.addColorStop(0, '#3A2A5A'); sky.addColorStop(0.6, '#7B4A6E'); sky.addColorStop(1, '#C88A5A');
  } else {
    sky.addColorStop(0, stg.sky[0]); sky.addColorStop(0.7, stg.sky[1]); sky.addColorStop(1, stg.sky[2]);
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const space = !bossArena && stg.id === 'space';

  // 宇宙は星をちりばめる
  if (space) {
    for (const st of stars) {
      ctx.globalAlpha = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(st.tw));
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 太陽／月／惑星
  if (space) {
    drawRingPlanet(W * 0.82, H * 0.15, Math.min(W, H) * 0.09);
  } else {
    ctx.fillStyle = bossArena ? '#F2C24B' : (stg.lava ? '#FFB94D' : '#FFE873');
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.13, Math.min(W, H) * 0.07, 0, Math.PI * 2);
    ctx.fill();
  }

  // 雲（宇宙では出さない）
  if (!space) {
    ctx.fillStyle = stg.lava && !bossArena ? 'rgba(90,60,70,0.5)' : 'rgba(255,255,255,0.9)';
    for (const c of clouds) {
      const s = c.s * Math.min(W, H) * 0.05;
      ctx.beginPath();
      ctx.arc(c.x, c.y, s, 0, Math.PI * 2);
      ctx.arc(c.x + s * 0.9, c.y - s * 0.3, s * 0.8, 0, Math.PI * 2);
      ctx.arc(c.x + s * 1.8, c.y, s * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 遠景の飾りと建物（ボス戦では出さない）
  if (!bossArena) {
    for (const t of trees) {
      const s = t.s * Math.min(W, H) * 0.09;
      if (stg.decor === 'island') drawIsland(t.x, groundY, s);
      else if (stg.decor === 'volcano') drawVolcanoCone(t.x, groundY, s);
      else if (stg.decor === 'space') drawSpacePlanet(t.x, groundY, s, t.s);
      else drawTreeCone(t.x, groundY, s, t.s);
    }
    for (const hs of houses) {
      const s = hs.s * Math.min(W, H) * 0.11;
      if (stg.id === 'sea') drawLighthouse(hs.x, groundY, s, hs.kind);
      else if (stg.id === 'volcano') drawHut(hs.x, groundY, s, hs.kind);
      else if (stg.id === 'space') drawRocket(hs.x, groundY, s, hs.kind);
      else drawHouse(hs.x, groundY, s, hs.kind);
    }
  }

  // 地面
  drawGround(stg, bossArena, groundY);
}

// 宇宙：リングのある惑星
function drawRingPlanet(x, y, r) {
  ctx.strokeStyle = 'rgba(255,220,150,0.55)'; ctx.lineWidth = r * 0.14;
  ctx.beginPath(); ctx.ellipse(x, y, r * 1.7, r * 0.55, -0.4, Math.PI * 0.15, Math.PI * 1.15); ctx.stroke();
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.2, x, y, r);
  g.addColorStop(0, '#FFE1A8'); g.addColorStop(0.5, '#E8A24A'); g.addColorStop(1, '#8A4A2A');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,150,0.55)'; ctx.lineWidth = r * 0.14;
  ctx.beginPath(); ctx.ellipse(x, y, r * 1.7, r * 0.55, -0.4, Math.PI * 1.15, Math.PI * 0.15 + Math.PI * 2); ctx.stroke();
}
// 宇宙：遠くの惑星／小惑星
function drawSpacePlanet(x, gy, s, sc) {
  const idx = Math.floor(sc * 97) % 4;
  const cols = [['#F0946A', '#6A2A20'], ['#5AB0F0', '#183A6A'], ['#A88AE8', '#3A2060'], ['#5AD0A8', '#1A5A44']];
  const cy = gy - s * 0.6;
  const g = ctx.createRadialGradient(x - s * 0.4, cy - s * 0.4, s * 0.2, x, cy, s * 1.2);
  g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.35, cols[idx][0]); g.addColorStop(1, cols[idx][1]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, cy, s * 1.1, 0, Math.PI * 2); ctx.fill();
  // クレーター
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.arc(x + s * 0.3, cy + s * 0.2, s * 0.22, 0, Math.PI * 2); ctx.arc(x - s * 0.35, cy + s * 0.35, s * 0.14, 0, Math.PI * 2); ctx.fill();
}
// 宇宙：ロケット
function drawRocket(x, gy, s, kind) {
  const bh = s * 1.7, bw = s * 0.55;
  ctx.fillStyle = '#EBEFF5';
  ctx.beginPath();
  ctx.moveTo(x, gy - bh - s * 0.5);
  ctx.quadraticCurveTo(x - bw, gy - bh * 0.7, x - bw * 0.7, gy - bh * 0.28);
  ctx.lineTo(x - bw * 0.7, gy);
  ctx.lineTo(x + bw * 0.7, gy);
  ctx.lineTo(x + bw * 0.7, gy - bh * 0.28);
  ctx.quadraticCurveTo(x + bw, gy - bh * 0.7, x, gy - bh - s * 0.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5BC0FF';
  ctx.beginPath(); ctx.arc(x, gy - bh * 0.62, s * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#E8433B';
  ctx.beginPath(); ctx.moveTo(x - bw * 0.7, gy - bh * 0.22); ctx.lineTo(x - bw * 1.35, gy); ctx.lineTo(x - bw * 0.7, gy); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + bw * 0.7, gy - bh * 0.22); ctx.lineTo(x + bw * 1.35, gy); ctx.lineTo(x + bw * 0.7, gy); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFB03B';
  ctx.beginPath(); ctx.moveTo(x - bw * 0.4, gy); ctx.lineTo(x, gy + s * 0.55); ctx.lineTo(x + bw * 0.4, gy); ctx.closePath(); ctx.fill();
}

function drawTreeCone(x, gy, s, sc) {
  ctx.fillStyle = sc > 1 ? '#4C9A50' : '#6DBB6F';
  ctx.beginPath();
  ctx.moveTo(x, gy - s * 2.4); ctx.lineTo(x - s, gy); ctx.lineTo(x + s, gy); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8B5A2B';
  ctx.fillRect(x - s * 0.12, gy - s * 0.2, s * 0.24, s * 0.2);
}
function drawIsland(x, gy, s) {
  // 砂の島＋ヤシの木
  ctx.fillStyle = '#EAD9A0';
  ctx.beginPath(); ctx.ellipse(x, gy, s * 1.3, s * 0.5, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#7A5A2A'; ctx.lineWidth = s * 0.14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, gy - s * 0.1); ctx.quadraticCurveTo(x - s * 0.4, gy - s * 1.1, x - s * 0.1, gy - s * 1.7); ctx.stroke();
  ctx.fillStyle = '#4CAE6A';
  for (const a of [-1.1, -0.4, 0.3, 1.0]) {
    ctx.beginPath();
    ctx.ellipse(x - s * 0.1 + Math.cos(a) * s * 0.5, gy - s * 1.7 + Math.sin(a) * s * 0.35, s * 0.55, s * 0.2, a, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawVolcanoCone(x, gy, s) {
  ctx.fillStyle = '#4A3330';
  ctx.beginPath();
  ctx.moveTo(x - s * 1.4, gy); ctx.lineTo(x - s * 0.4, gy - s * 2.0); ctx.lineTo(x + s * 0.4, gy - s * 2.0); ctx.lineTo(x + s * 1.4, gy); ctx.closePath(); ctx.fill();
  // 火口の光
  ctx.fillStyle = '#FF7A2B';
  ctx.beginPath(); ctx.ellipse(x, gy - s * 2.0, s * 0.42, s * 0.14, 0, 0, Math.PI * 2); ctx.fill();
  // 煙
  ctx.fillStyle = 'rgba(120,90,90,0.4)';
  ctx.beginPath(); ctx.arc(x, gy - s * 2.4, s * 0.35, 0, Math.PI * 2); ctx.arc(x + s * 0.2, gy - s * 2.8, s * 0.28, 0, Math.PI * 2); ctx.fill();
}
function drawHouse(x, gy, s, kind) {
  const wall = ['#F2D6A0', '#E8B98A', '#D6E2F2'][kind];
  const roof = ['#C0522D', '#8A5A3A', '#6E93B8'][kind];
  const w = s * 1.4, h = s * 1.1;
  ctx.fillStyle = wall; ctx.fillRect(x - w / 2, gy - h, w, h);
  ctx.fillStyle = roof;
  ctx.beginPath(); ctx.moveTo(x - w * 0.62, gy - h); ctx.lineTo(x, gy - h - s * 0.7); ctx.lineTo(x + w * 0.62, gy - h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7A4A28'; ctx.fillRect(x - s * 0.2, gy - s * 0.62, s * 0.4, s * 0.62);
  ctx.fillStyle = '#9FD8F2'; ctx.fillRect(x + s * 0.28, gy - h + s * 0.22, s * 0.32, s * 0.32);
}
function drawLighthouse(x, gy, s, kind) {
  const w = s * 0.62, h = s * 1.9;
  ctx.fillStyle = '#F2F2F2'; ctx.fillRect(x - w / 2, gy - h, w, h);
  ctx.fillStyle = '#E8433B';
  for (let i = 0; i < 3; i++) ctx.fillRect(x - w / 2, gy - h + h * (0.16 + i * 0.28), w, h * 0.14);
  ctx.fillStyle = '#555'; ctx.fillRect(x - w * 0.62, gy - h - s * 0.16, w * 1.24, s * 0.18);
  ctx.fillStyle = '#FFE873';
  ctx.beginPath(); ctx.arc(x, gy - h - s * 0.02, s * 0.2, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#8A5030'; ctx.beginPath(); ctx.moveTo(x - w * 0.7, gy - h - s * 0.16); ctx.lineTo(x, gy - h - s * 0.55); ctx.lineTo(x + w * 0.7, gy - h - s * 0.16); ctx.closePath(); ctx.fill();
}
function drawHut(x, gy, s, kind) {
  const w = s * 1.3, h = s * 0.9;
  ctx.fillStyle = '#5A4038'; ctx.fillRect(x - w / 2, gy - h, w, h);
  ctx.fillStyle = '#33231E';
  ctx.beginPath(); ctx.moveTo(x - w * 0.62, gy - h); ctx.lineTo(x, gy - h - s * 0.6); ctx.lineTo(x + w * 0.62, gy - h); ctx.closePath(); ctx.fill();
  // 中から漏れる溶岩の光
  ctx.fillStyle = '#FF8A2B'; ctx.fillRect(x - s * 0.18, gy - s * 0.5, s * 0.36, s * 0.5);
}
function drawGround(stg, boss, groundY) {
  if (boss) {
    ctx.fillStyle = '#5B4A3A'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#43362A';
    const off = -(scrollX * 0.9) % 60;
    for (let x = off; x < W + 60; x += 60) { ctx.beginPath(); ctx.arc(x, groundY + 4, 20, Math.PI, 0); ctx.fill(); }
    return;
  }
  if (stg.water) {
    ctx.fillStyle = stg.ground; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = Math.min(W, H) * 0.01;
    for (let row = 0; row < 3; row++) {
      const yy = groundY + (H - groundY) * (0.25 + row * 0.28);
      const off = -(scrollX * (0.7 + row * 0.2)) % 70;
      ctx.beginPath();
      for (let x = off - 70; x < W + 70; x += 70) { ctx.moveTo(x, yy); ctx.quadraticCurveTo(x + 17, yy - 6, x + 35, yy); }
      ctx.stroke();
    }
  } else if (stg.lava) {
    ctx.fillStyle = stg.ground; ctx.fillRect(0, groundY, W, H - groundY);
    // 上ふちの溶岩グロー
    const lg = ctx.createLinearGradient(0, groundY, 0, groundY + (H - groundY) * 0.5);
    lg.addColorStop(0, '#FF7A2B'); lg.addColorStop(1, 'rgba(255,122,43,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, groundY, W, (H - groundY) * 0.5);
    ctx.strokeStyle = '#FFB04D'; ctx.lineWidth = Math.min(W, H) * 0.012;
    const off = -(scrollX * 0.9) % 90;
    ctx.beginPath();
    for (let x = off - 90; x < W + 90; x += 90) { ctx.moveTo(x, groundY + 8); ctx.lineTo(x + 22, groundY + 20); ctx.lineTo(x + 45, groundY + 6); ctx.lineTo(x + 70, groundY + 22); }
    ctx.stroke();
  } else if (stg.id === 'space') {
    ctx.fillStyle = stg.ground; ctx.fillRect(0, groundY, W, H - groundY);
    // 月面の光るふち
    ctx.strokeStyle = 'rgba(150,180,255,0.5)'; ctx.lineWidth = Math.min(W, H) * 0.008;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    // クレーター
    ctx.fillStyle = stg.ground2;
    const off = -(scrollX * 0.9) % 90;
    for (let x = off; x < W + 90; x += 90) {
      ctx.beginPath(); ctx.ellipse(x, groundY + (H - groundY) * 0.45, 24, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 45, groundY + (H - groundY) * 0.7, 14, 6, 0, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    ctx.fillStyle = stg.ground; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = stg.ground2;
    const off = -(scrollX * 0.9) % 60;
    for (let x = off; x < W + 60; x += 60) { ctx.beginPath(); ctx.arc(x, groundY + 4, 20, Math.PI, 0); ctx.fill(); }
  }
}

function drawObstacles() {
  const groundY = H * 0.88;
  for (const ob of obstacles) {
    const sx = ob.x - scrollX;
    if (sx < -ob.w * 3 || sx > W + ob.w * 3) continue;
    if (ob.type === 'top') {
      // 上から垂れる木の枝＋葉っぱ
      ctx.fillStyle = '#8B5A2B';
      roundRect(sx - ob.w / 2, -10, ob.w, ob.h + 10, ob.w * 0.3);
      ctx.fill();
      ctx.fillStyle = '#5B9E4D';
      ctx.beginPath();
      ctx.arc(sx, ob.h, ob.w * 0.95, 0, Math.PI * 2);
      ctx.arc(sx - ob.w * 0.8, ob.h - ob.w * 0.5, ob.w * 0.7, 0, Math.PI * 2);
      ctx.arc(sx + ob.w * 0.8, ob.h - ob.w * 0.5, ob.w * 0.7, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 下から生えるキノコ
      const capR = ob.w * 1.15;
      ctx.fillStyle = '#F5E6C8';
      roundRect(sx - ob.w / 2, groundY - ob.h + capR * 0.4, ob.w, ob.h, ob.w * 0.3);
      ctx.fill();
      ctx.fillStyle = '#E85D5D';
      ctx.beginPath();
      ctx.arc(sx, groundY - ob.h + capR * 0.55, capR, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(sx - capR * 0.4, groundY - ob.h + capR * 0.25, capR * 0.16, 0, Math.PI * 2);
      ctx.arc(sx + capR * 0.35, groundY - ob.h + capR * 0.32, capR * 0.13, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawItems() {
  const s = Math.min(W, H) * 0.032;
  for (const it of items) {
    if (it.taken) continue;
    const sx = it.x - scrollX;
    if (sx < -60 || sx > W + 60) continue;
    const iy = it.y + Math.sin(it.bob) * 8;
    if (it.kind === 'friend') {
      // 仲間アイテム（キラキラの光の中のテントウムシ）
      ctx.save();
      const glow = ctx.createRadialGradient(sx, iy, s * 0.2, sx, iy, s * 1.8);
      glow.addColorStop(0, 'rgba(180,230,255,0.9)');
      glow.addColorStop(1, 'rgba(180,230,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(sx, iy, s * 1.8, 0, Math.PI * 2); ctx.fill();
      drawBug('ladybug', sx, iy, s * 1.15, stateTimer * 20);
      ctx.restore();
      // 「なかま」ラベル
      ctx.fillStyle = '#2A6FB0';
      ctx.font = `bold ${s * 0.9}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('なかま', sx, iy - s * 2.1);
    } else {
      // 昆虫ゼリー（カップ）
      ctx.fillStyle = '#FFB84D';
      ctx.beginPath();
      ctx.moveTo(sx - s, iy - s * 0.6);
      ctx.lineTo(sx + s, iy - s * 0.6);
      ctx.lineTo(sx + s * 0.75, iy + s * 0.8);
      ctx.lineTo(sx - s * 0.75, iy + s * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#FFE0A3';
      ctx.beginPath();
      ctx.ellipse(sx, iy - s * 0.6, s, s * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(sx - s * 0.35, iy, s * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// 仲間の虫を描く共通関数（テントウムシ / ハチ / アリ）
function drawBug(type, x, y, s, wingPhase) {
  ctx.save();
  ctx.translate(x, y);
  const flap = Math.sin(wingPhase);
  if (type === 'bee') {
    // 羽
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.save(); ctx.rotate(-0.6 - flap * 0.4);
    ctx.beginPath(); ctx.ellipse(0, -s * 0.7, s * 0.35, s * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // 体（黄色×黒しま）
    ctx.fillStyle = '#F2C33A';
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.8, s * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3A2A10';
    for (let i = -1; i <= 1; i++) { ctx.fillRect(i * s * 0.35 - s * 0.08, -s * 0.5, s * 0.16, s); }
    ctx.fillStyle = '#2A1C08';
    ctx.beginPath(); ctx.ellipse(s * 0.75, 0, s * 0.28, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'ant') {
    // アリ（黒い3節）
    ctx.fillStyle = '#3A2A22';
    ctx.beginPath(); ctx.ellipse(-s * 0.55, 0, s * 0.5, s * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.34, s * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.5, 0, s * 0.4, s * 0.38, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3A2A22'; ctx.lineWidth = s * 0.08;
    ctx.beginPath(); ctx.moveTo(s * 0.7, -s * 0.2); ctx.lineTo(s * 0.95, -s * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.7, -s * 0.2); ctx.lineTo(s * 0.98, -s * 0.3); ctx.stroke();
  } else if (type === 'grasshopper') {
    // バッタ（緑・大きなジャンプ脚）※前方＝右向き
    ctx.strokeStyle = '#4E9A34'; ctx.lineWidth = s * 0.13; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // うしろ脚（くの字のジャンプ脚）
    ctx.beginPath();
    ctx.moveTo(-s * 0.25, s * 0.1); ctx.lineTo(-s * 0.72, -s * 0.55); ctx.lineTo(-s * 1.0, s * 0.55);
    ctx.stroke();
    // 中脚・前脚
    ctx.lineWidth = s * 0.07;
    ctx.beginPath(); ctx.moveTo(s * 0.05, s * 0.3); ctx.lineTo(s * 0.18, s * 0.62); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.4, s * 0.28); ctx.lineTo(s * 0.55, s * 0.6); ctx.stroke();
    // 体
    ctx.fillStyle = '#83C24E';
    ctx.beginPath(); ctx.ellipse(-s * 0.1, 0, s * 0.88, s * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = s * 0.05;
    ctx.beginPath(); ctx.moveTo(-s * 0.8, s * 0.02); ctx.lineTo(s * 0.5, s * 0.02); ctx.stroke();
    // 頭
    ctx.fillStyle = '#6FAE40';
    ctx.beginPath(); ctx.ellipse(s * 0.72, -s * 0.04, s * 0.34, s * 0.36, 0, 0, Math.PI * 2); ctx.fill();
    // 目
    ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(s * 0.82, -s * 0.12, s * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(s * 0.86, -s * 0.12, s * 0.06, 0, Math.PI * 2); ctx.fill();
    // 触角
    ctx.strokeStyle = '#4E9A34'; ctx.lineWidth = s * 0.05;
    ctx.beginPath(); ctx.moveTo(s * 0.95, -s * 0.22); ctx.lineTo(s * 1.35, -s * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.95, -s * 0.16); ctx.lineTo(s * 1.35, -s * 0.28); ctx.stroke();
  } else if (type === 'mantis') {
    // カマキリ（緑・鎌の前脚）※前方＝右向き
    const g = '#6FC24E';
    ctx.strokeStyle = '#4E9A34'; ctx.lineWidth = s * 0.09; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // 後ろ脚2本
    for (const lx of [-s * 0.55, -s * 0.15]) { ctx.beginPath(); ctx.moveTo(lx, s * 0.2); ctx.lineTo(lx - s * 0.12, s * 0.62); ctx.stroke(); }
    // 体（細長い）
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(-s * 0.25, 0, s * 0.8, s * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    // 前胸（首）
    ctx.beginPath(); ctx.ellipse(s * 0.4, -s * 0.02, s * 0.4, s * 0.2, -0.15, 0, Math.PI * 2); ctx.fill();
    // 頭（三角）
    ctx.fillStyle = '#5CB03E';
    ctx.beginPath(); ctx.moveTo(s * 0.72, -s * 0.38); ctx.lineTo(s * 1.02, -s * 0.05); ctx.lineTo(s * 0.72, s * 0.12); ctx.closePath(); ctx.fill();
    // 大きな目
    ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(s * 0.86, -s * 0.22, s * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(s * 0.9, -s * 0.22, s * 0.06, 0, Math.PI * 2); ctx.fill();
    // 鎌（前脚）
    ctx.strokeStyle = g; ctx.lineWidth = s * 0.13;
    ctx.beginPath(); ctx.moveTo(s * 0.45, s * 0.05); ctx.lineTo(s * 0.85, s * 0.28); ctx.lineTo(s * 1.2, -s * 0.08); ctx.stroke();
    // 鎌の内側のトゲ
    ctx.strokeStyle = '#3E8A2E'; ctx.lineWidth = s * 0.045;
    ctx.beginPath(); ctx.moveTo(s * 0.9, s * 0.16); ctx.lineTo(s * 1.12, -s * 0.02); ctx.stroke();
    // 触角
    ctx.strokeStyle = '#4E9A34'; ctx.lineWidth = s * 0.045;
    ctx.beginPath(); ctx.moveTo(s * 0.92, -s * 0.34); ctx.lineTo(s * 1.28, -s * 0.6); ctx.stroke();
  } else {
    // テントウムシ
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.save(); ctx.rotate(-0.5 - flap * 0.4);
    ctx.beginPath(); ctx.ellipse(-s * 0.1, -s * 0.6, s * 0.35, s * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#E23B3B';
    ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2A1010'; ctx.lineWidth = s * 0.06;
    ctx.beginPath(); ctx.moveTo(0, -s * 0.7); ctx.lineTo(0, s * 0.7); ctx.stroke();
    ctx.fillStyle = '#2A1010';
    ctx.beginPath(); ctx.arc(s * 0.68, 0, s * 0.3, 0, Math.PI * 2); ctx.fill();   // 頭
    ctx.fillStyle = '#2A1010';
    for (const [dx, dy] of [[-0.28, -0.28], [-0.28, 0.28], [0.15, -0.3], [0.15, 0.3]]) {
      ctx.beginPath(); ctx.arc(dx * s, dy * s, s * 0.11, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawCompanions() {
  const s = Math.min(W, H) * 0.03;
  for (const c of companions) {
    drawBug(c.type, c.x, c.y, s, c.wing);
  }
}

// 道中の敵（スズメバチ）
function drawEnemies() {
  const s = Math.min(W, H) * 0.045;
  for (const e of enemies) {
    const ex = e.x - scrollX;
    if (ex < -s * 3 || ex > W + s * 3) continue;
    ctx.save();
    ctx.translate(ex, e.y);
    const flap = Math.sin(e.wing);
    const flash = e.hurt > 0;
    // 羽（とがった半透明）
    ctx.fillStyle = 'rgba(210,190,255,0.55)';
    for (const sgn of [-1, 1]) {
      ctx.save(); ctx.rotate(sgn * (0.5 + flap * 0.4));
      ctx.beginPath(); ctx.ellipse(sgn * s * 0.2, -s * 0.7, s * 0.3, s * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 針（お尻の毒針）
    ctx.fillStyle = '#2A1030';
    ctx.beginPath();
    ctx.moveTo(-s * 0.95, 0); ctx.lineTo(-s * 1.35, -s * 0.1); ctx.lineTo(-s * 0.95, s * 0.14);
    ctx.closePath(); ctx.fill();
    // 体（濃い紫＋黒しま）
    const g = ctx.createLinearGradient(0, -s * 0.6, 0, s * 0.6);
    g.addColorStop(0, flash ? '#FFFFFF' : '#7A2E6E');
    g.addColorStop(1, flash ? '#FFCFE8' : '#3A1030');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.95, s * 0.62, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = flash ? '#E0A0C0' : '#25101E';
    for (let i = -1; i <= 1; i++) { ctx.fillRect(i * s * 0.4 - s * 0.08, -s * 0.5, s * 0.16, s); }
    // 頭
    ctx.fillStyle = flash ? '#FFFFFF' : '#2A1224';
    ctx.beginPath(); ctx.ellipse(s * 0.85, -s * 0.05, s * 0.4, s * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    // 怒った赤い目
    ctx.fillStyle = '#FF3B4B';
    ctx.shadowColor = '#FF3B4B'; ctx.shadowBlur = s * 0.3;
    ctx.beginPath(); ctx.ellipse(s * 0.92, -s * 0.12, s * 0.16, s * 0.11, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // 牙
    ctx.strokeStyle = '#1A0A16'; ctx.lineWidth = s * 0.07; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 1.15, s * 0.08); ctx.lineTo(s * 1.35, s * 0.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 1.15, s * 0.18); ctx.lineTo(s * 1.28, s * 0.38); ctx.stroke();
    ctx.restore();
  }
}

function drawShots() {
  for (const s of shots) {
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.side === 'player' && s.kind === 'laser') {
      // レーザービーム（横に長い光の帯）
      const len = s.r * 7, hh = s.r * 0.9;
      const ang = Math.atan2(s.vy, s.vx);
      ctx.rotate(ang);
      const g = ctx.createLinearGradient(-len, 0, len, 0);
      g.addColorStop(0, 'rgba(138,240,255,0)');
      g.addColorStop(0.5, '#EAFFFF');
      g.addColorStop(1, 'rgba(138,240,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, len, hh, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.ellipse(0, 0, len * 0.8, hh * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    } else if (s.side === 'player' && s.kind === 'bomb') {
      // 爆弾（黒い玉＋導火線の火花）
      ctx.fillStyle = '#2A2A32';
      ctx.beginPath(); ctx.arc(0, 0, s.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.arc(-s.r * 0.3, -s.r * 0.3, s.r * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#8A6A3A'; ctx.lineWidth = s.r * 0.16;
      ctx.beginPath(); ctx.moveTo(0, -s.r); ctx.quadraticCurveTo(s.r * 0.5, -s.r * 1.5, s.r * 0.2, -s.r * 1.8); ctx.stroke();
      ctx.fillStyle = Math.sin(s.spin * 3) > 0 ? '#FFD24D' : '#FF6B2B';
      ctx.beginPath(); ctx.arc(s.r * 0.2, -s.r * 1.9, s.r * 0.28, 0, Math.PI * 2); ctx.fill();
    } else if (s.side === 'player' && s.kind === 'flame') {
      // 炎（めらめら揺れる炎の粒）
      const rr = s.r * (s.grow || 1);
      const fl = 1 + Math.sin(s.flick + s.spin * 2) * 0.15;
      const g = ctx.createRadialGradient(0, 0, rr * 0.15, 0, 0, rr * 1.5 * fl);
      g.addColorStop(0, 'rgba(255,255,220,0.95)');
      g.addColorStop(0.4, '#FFC22B');
      g.addColorStop(0.75, '#FF6B2B');
      g.addColorStop(1, 'rgba(220,50,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, rr * 1.5 * fl, 0, Math.PI * 2); ctx.fill();
    } else if (s.side === 'player') {
      // 光の弾（通常・散弾）
      const g = ctx.createRadialGradient(0, 0, s.r * 0.2, 0, 0, s.r * 1.4);
      g.addColorStop(0, '#FFFFFF');
      g.addColorStop(0.5, s.color);
      g.addColorStop(1, 'rgba(255,220,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, s.r * 1.4, 0, Math.PI * 2); ctx.fill();
    } else {
      // 敵のエネルギー弾
      ctx.rotate(s.spin);
      const g = ctx.createRadialGradient(0, 0, s.r * 0.2, 0, 0, s.r * 1.3);
      g.addColorStop(0, '#FFFFFF');
      g.addColorStop(0.4, s.color);
      g.addColorStop(1, 'rgba(160,60,220,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, s.r * 1.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawGoalFlag() {
  const sx = goalDist - scrollX + W * 0.5;
  if (sx > W + 100) return;
  const groundY = H * 0.88;
  const poleH = H * 0.5;
  ctx.fillStyle = '#888';
  ctx.fillRect(sx - 4, groundY - poleH, 8, poleH);
  // チェック旗
  const fw = Math.min(W, H) * 0.18, fh = fw * 0.62;
  const n = 4;
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < n; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#333' : '#FFF';
      ctx.fillRect(sx + 4 + c * fw / n, groundY - poleH + r * fh / 3, fw / n, fh / 3);
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 大あご用のグラデーション
function mandGrad(vs, c0, c1) {
  const g = ctx.createLinearGradient(vs * 1.1, -vs * 0.6, vs * 2.4, vs * 0.4);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  return g;
}
// 片側の大あご（my=-1で上、+1で下）。open=あごの開き具合。
function drawMandible(vs, my, open, fill, stroke) {
  const o = open;
  ctx.beginPath();
  ctx.moveTo(vs * 1.12, my * vs * 0.05);
  // 外側の縁：外へふくらみながら前方へ
  ctx.quadraticCurveTo(vs * 1.75, my * vs * 0.82 * o, vs * 2.3, my * vs * 0.5 * o);
  // 先端が内側へフックする
  ctx.quadraticCurveTo(vs * 2.66, my * vs * 0.24 * o, vs * 2.34, my * vs * 0.04);
  // 内側の先端
  ctx.quadraticCurveTo(vs * 2.12, my * vs * 0.26 * o, vs * 1.96, my * vs * 0.2 * o);
  // 内歯（中心に向かってとがる）
  ctx.lineTo(vs * 1.82, my * vs * 0.0);
  ctx.lineTo(vs * 1.68, my * vs * 0.24 * o);
  // 内側の縁を付け根へ戻す
  ctx.quadraticCurveTo(vs * 1.4, my * vs * 0.1 * o, vs * 1.12, my * vs * 0.0);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = vs * 0.045; ctx.lineJoin = 'round'; ctx.stroke();
}
function drawStar(x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const a2 = a + Math.PI / 5;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBeetle() {
  const b = beetle;
  const s = b.size || Math.min(W, H) * 0.055;
  // 無敵中は点滅
  if (b.invincible > 0 && Math.floor(b.invincible * 10) % 2 === 0) return;

  const p = b.power | 0;                            // 強化レベル（ゼリーの数）
  const GOLD = 10;                                  // この数で全身が金色（最終形態）
  const gold = p >= GOLD;
  const auraLv = Math.min(p / GOLD, 1);             // 0..1（オーラの強さ）
  const grow = 1 + Math.min(p, 12) * 0.016;         // 強化で少し大きく
  const atk = b.atkAnim > 0 ? b.atkAnim / 0.3 : 0;  // 攻撃モーション 1→0
  const chomp = atk > 0 ? 1 - Math.sin((1 - atk) * Math.PI) * 0.72 : 1;   // 開→閉→開
  const lunge = atk > 0 ? Math.sin((1 - atk) * Math.PI) * s * 0.5 : 0;    // 前方へ突き出す

  ctx.save();
  ctx.translate(b.x + lunge, b.y);
  ctx.rotate(b.tilt || 0);
  ctx.scale(grow, grow);

  const vs = s;
  const flap = Math.sin(b.wingPhase);

  // ---- 強化オーラ（パワーアップで体にまとう光。数が増えるほど強く輝く） ----
  if (p >= 1) {
    const pulse = 1 + Math.sin(stateTimer * 4) * 0.06;
    const rad = vs * (1.7 + auraLv * 1.4) * pulse;
    const inner = gold ? 'rgba(255,240,150,0.9)' : `rgba(255,226,140,${0.2 + auraLv * 0.45})`;
    const aura = ctx.createRadialGradient(0, 0, vs * 0.6, 0, 0, rad);
    aura.addColorStop(0, inner);
    aura.addColorStop(0.6, gold ? 'rgba(255,215,90,0.35)' : `rgba(255,220,120,${0.12 + auraLv * 0.2})`);
    aura.addColorStop(1, 'rgba(255,215,90,0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fill();
  }

  // ---- 羽（半透明・後ろ） ----
  ctx.fillStyle = 'rgba(255, 236, 179, 0.7)';
  ctx.save(); ctx.rotate(-0.5 - flap * 0.45);
  ctx.beginPath(); ctx.ellipse(-vs * 0.25, -vs * 0.9, vs * 0.5, vs * 1.0, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(-0.2 - flap * 0.35);
  ctx.beginPath(); ctx.ellipse(vs * 0.05, -vs * 0.95, vs * 0.46, vs * 0.9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  // ---- 脚（6本） ----
  ctx.strokeStyle = '#160C05';
  ctx.lineWidth = vs * 0.12;
  ctx.lineCap = 'round';
  for (const lx of [-vs * 0.55, -vs * 0.05, vs * 0.45]) {
    ctx.beginPath();
    ctx.moveTo(lx, vs * 0.45);
    ctx.lineTo(lx - vs * 0.12, vs * 0.82);
    ctx.lineTo(lx - vs * 0.34, vs * 1.02);
    ctx.stroke();
  }
  // 前脚（前方へ）
  ctx.beginPath();
  ctx.moveTo(vs * 0.75, vs * 0.32);
  ctx.lineTo(vs * 1.02, vs * 0.66);
  ctx.lineTo(vs * 1.28, vs * 0.72);
  ctx.stroke();

  // ---- 上翅（エリトラ：細長く光沢のある平たい体。最終形態で金色に） ----
  const bodyGrad = ctx.createLinearGradient(-vs, -vs * 0.6, vs * 0.6, vs * 0.6);
  if (gold) {
    bodyGrad.addColorStop(0, '#FFF4B8');
    bodyGrad.addColorStop(0.5, '#F2C33A');
    bodyGrad.addColorStop(1, '#B8860B');
  } else {
    bodyGrad.addColorStop(0, '#4A2E17');
    bodyGrad.addColorStop(0.5, '#2A1810');
    bodyGrad.addColorStop(1, '#150B04');
  }
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(-vs * 0.12, 0, vs * 1.18, vs * 0.64, 0, 0, Math.PI * 2);
  ctx.fill();
  // エリトラの合わせ目
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = vs * 0.05;
  ctx.beginPath(); ctx.moveTo(-vs * 1.25, 0); ctx.lineTo(vs * 0.5, 0); ctx.stroke();
  // つや
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(-vs * 0.4, -vs * 0.28, vs * 0.55, vs * 0.15, -0.22, 0, Math.PI * 2); ctx.fill();

  // ---- 前胸（プロノータム） ----
  const proGrad = ctx.createLinearGradient(0, -vs * 0.5, 0, vs * 0.5);
  if (gold) { proGrad.addColorStop(0, '#FFE58A'); proGrad.addColorStop(1, '#C8931A'); }
  else { proGrad.addColorStop(0, '#3A2211'); proGrad.addColorStop(1, '#150B04'); }
  ctx.fillStyle = proGrad;
  ctx.beginPath(); ctx.ellipse(vs * 0.6, 0, vs * 0.52, vs * 0.56, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.ellipse(vs * 0.5, -vs * 0.26, vs * 0.3, vs * 0.1, -0.2, 0, Math.PI * 2); ctx.fill();

  // ---- 頭 ----
  ctx.fillStyle = gold ? '#C8931A' : '#150B04';
  ctx.beginPath(); ctx.ellipse(vs * 1.12, 0, vs * 0.42, vs * 0.44, 0, 0, Math.PI * 2); ctx.fill();

  // ---- 大あご（クワガタの象徴！ハサミ型。色はパワーで変えず、最終形態のみ金色） ----
  let mandFill, mandStroke;
  if (gold) { mandFill = mandGrad(vs, '#FFF3B0', '#E8A417'); mandStroke = '#8A5E00'; }
  else { mandFill = mandGrad(vs, '#5A3A1E', '#241206'); mandStroke = '#0E0702'; }
  drawMandible(vs, -1, chomp, mandFill, mandStroke);
  drawMandible(vs, 1, chomp, mandFill, mandStroke);

  // ---- 目 ----
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(vs * 1.1, -vs * 0.12, vs * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#161616';
  ctx.beginPath(); ctx.arc(vs * 1.15, -vs * 0.1, vs * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(vs * 1.19, -vs * 0.14, vs * 0.035, 0, Math.PI * 2); ctx.fill();

  // ---- 星のキラキラ（最終形態＝金色のとき） ----
  if (gold) {
    for (let i = 0; i < 4; i++) {
      const a = stateTimer * 2.2 + i * Math.PI * 2 / 4;
      drawStar(Math.cos(a) * vs * 2.0, Math.sin(a) * vs * 1.35, vs * 0.2, '#FFF3A0');
    }
  }

  // ---- 攻撃の衝撃波（前方） ----
  if (atk > 0) {
    const prog = 1 - atk;
    ctx.globalAlpha = Math.max(0, atk * 0.9);
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = vs * 0.16;
    ctx.beginPath();
    ctx.arc(vs * 2.1, 0, vs * (0.7 + prog * 1.5), -1.0, 1.0);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawAttackButton() {
  if (state !== STATE.PLAY && state !== STATE.BOSS) return;
  const b = attackButton();
  const held = attackHeld();
  const ready = beetle.atkCd <= 0;
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.arc(b.x, b.y + b.r * 0.08, b.r, 0, Math.PI * 2); ctx.fill();
  // 本体
  const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.2, b.x, b.y, b.r);
  g.addColorStop(0, ready ? '#FF9A8A' : '#C79088');
  g.addColorStop(1, ready ? '#E8433B' : '#9A5C57');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (held ? 0.92 : 1), 0, Math.PI * 2); ctx.fill();
  // ふち
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = b.r * 0.08;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.98, 0, Math.PI * 2); ctx.stroke();
  // アイコン
  ctx.font = `${b.r * 0.95}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('💥', b.x, b.y - b.r * 0.08);
  // ラベル
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${b.r * 0.4}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
  ctx.fillText('こわす', b.x, b.y + b.r * 0.52);
  // クールダウンのリング
  if (!ready) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = b.r * 0.12;
    ctx.beginPath();
    const frac = 1 - beetle.atkCd / 0.42;
    ctx.arc(b.x, b.y, b.r * 0.72, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
  }
}

function drawMusicButton() {
  if (state === STATE.TITLE || state === STATE.LEVELUP) return;   // タイトル/選択中は非表示
  const b = musicButton();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `${b.r * 1.1}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Music.enabled ? '🔊' : '🔇', b.x, b.y + b.r * 0.05);
}

function drawBossBanner() {
  const base = Math.min(W, H);
  const a = Math.min(1, bossBanner / 0.4) * Math.min(1, (2.2 - bossBanner) / 0.3 + 0.3);
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, H * 0.34, W, H * 0.16);
  ctx.fillStyle = '#FF5B6E';
  ctx.font = `bold ${base * 0.11}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = base * 0.014; ctx.lineJoin = 'round';
  ctx.strokeText('ボス とうじょう！', W / 2, H * 0.42);
  ctx.fillText('ボス とうじょう！', W / 2, H * 0.42);
  ctx.restore();
}

// ---------- ボスのロボット ----------
function drawBoss() {
  if (!boss.active) return;
  const S = boss.size;
  ctx.save();
  ctx.translate(boss.x, boss.y);
  // 被弾フラッシュ
  const flash = boss.hurt > 0;

  // 影オーラ
  const aura = ctx.createRadialGradient(0, 0, S * 0.4, 0, 0, S * 1.5);
  aura.addColorStop(0, 'rgba(255,80,120,0.28)');
  aura.addColorStop(1, 'rgba(255,80,120,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, S * 1.5, 0, Math.PI * 2); ctx.fill();

  const metal = (x0, y0, x1, y1, c0, c1) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; };

  // 後方スラスター
  ctx.fillStyle = '#5A6270';
  roundRect(S * 0.55, -S * 0.5, S * 0.5, S, S * 0.15); ctx.fill();
  ctx.fillStyle = '#FF8A3B';
  for (const yy of [-S * 0.28, S * 0.28]) {
    ctx.beginPath(); ctx.ellipse(S * 1.05 + Math.random() * S * 0.1, yy, S * 0.12, S * 0.16, 0, 0, Math.PI * 2); ctx.fill();
  }

  // 肩アーマー
  ctx.fillStyle = metal(0, -S, 0, 0, '#9AA6B4', '#525A68');
  roundRect(-S * 0.75, -S * 0.92, S * 1.3, S * 0.5, S * 0.2); ctx.fill();

  // メインボディ（六角形の装甲）
  ctx.fillStyle = metal(-S * 0.8, -S * 0.8, S * 0.8, S * 0.8, '#8891A0', '#3C4350');
  ctx.beginPath();
  ctx.moveTo(-S * 0.85, -S * 0.55);
  ctx.lineTo(S * 0.55, -S * 0.78);
  ctx.lineTo(S * 0.8, 0);
  ctx.lineTo(S * 0.55, S * 0.78);
  ctx.lineTo(-S * 0.85, S * 0.55);
  ctx.lineTo(-S * 1.0, 0);
  ctx.closePath(); ctx.fill();
  // パネルライン
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = S * 0.03;
  ctx.beginPath(); ctx.moveTo(-S * 0.7, -S * 0.2); ctx.lineTo(S * 0.5, -S * 0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-S * 0.7, S * 0.2); ctx.lineTo(S * 0.5, S * 0.2); ctx.stroke();

  // 胸のコア（光る）
  const coreR = S * 0.26 * (1 + Math.sin(stateTimer * 5) * 0.08);
  const core = ctx.createRadialGradient(-S * 0.1, 0, coreR * 0.2, -S * 0.1, 0, coreR);
  core.addColorStop(0, '#FFFFFF');
  core.addColorStop(0.4, flash ? '#FFF0A0' : '#5BE0FF');
  core.addColorStop(1, flash ? '#FF8A3B' : '#1C7CB0');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(-S * 0.1, 0, coreR, 0, Math.PI * 2); ctx.fill();

  // 頭（バイザーに赤い目）
  ctx.fillStyle = metal(-S * 0.5, -S, -S * 0.5, -S * 0.5, '#AEB8C6', '#4C5462');
  roundRect(-S * 0.55, -S * 1.15, S * 0.7, S * 0.5, S * 0.14); ctx.fill();
  // バイザー
  ctx.fillStyle = '#1A1E28';
  roundRect(-S * 0.5, -S * 1.05, S * 0.6, S * 0.24, S * 0.1); ctx.fill();
  // 赤い目
  ctx.fillStyle = flash ? '#FFF3A0' : '#FF3B4B';
  ctx.shadowColor = '#FF3B4B'; ctx.shadowBlur = S * 0.2;
  ctx.beginPath(); ctx.ellipse(-S * 0.2, -S * 0.93, S * 0.22, S * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // アンテナ
  ctx.strokeStyle = '#AEB8C6'; ctx.lineWidth = S * 0.05;
  ctx.beginPath(); ctx.moveTo(-S * 0.3, -S * 1.15); ctx.lineTo(-S * 0.45, -S * 1.5); ctx.stroke();
  ctx.fillStyle = '#FF3B4B';
  ctx.beginPath(); ctx.arc(-S * 0.45, -S * 1.53, S * 0.07, 0, Math.PI * 2); ctx.fill();

  // 左腕の大砲（プレイヤー側＝画面左を向く）
  ctx.fillStyle = metal(-S, 0, -S * 1.6, 0, '#6B7482', '#39404C');
  roundRect(-S * 1.55, -S * 0.34, S * 0.75, S * 0.68, S * 0.16); ctx.fill();
  ctx.fillStyle = '#20242E';
  ctx.beginPath(); ctx.ellipse(-S * 1.5, 0, S * 0.14, S * 0.26, 0, 0, Math.PI * 2); ctx.fill();
  // 砲口の光（発射前の予兆）
  if (boss.introT <= 0 && boss.fireCd < 0.4 && !boss.defeated) {
    ctx.fillStyle = 'rgba(255,90,110,0.8)';
    ctx.beginPath(); ctx.arc(-S * 1.55, 0, S * 0.16 * (1 - boss.fireCd / 0.4), 0, Math.PI * 2); ctx.fill();
  }

  // 被弾で白フラッシュ
  if (flash) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, S * 0.95, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// 持っている武器のコンパクト表示（例：「⚡2 💣1」）
function weaponSummary() {
  const ic = { laser: '⚡', bomb: '💣', spread: '✳️', flame: '🔥' };
  const parts = [];
  for (const id of ['laser', 'bomb', 'spread', 'flame']) { const lv = beetle.weapons[id] || 0; if (lv > 0) parts.push(ic[id] + lv); }
  return parts.join(' ');
}
function drawHUD() {
  if (state !== STATE.PLAY && state !== STATE.GOAL && state !== STATE.RETRY && state !== STATE.BOSS) return;
  const pad = Math.min(W, H) * 0.022;
  const hs = Math.min(W, H) * 0.028;   // コンパクトに
  const sp = hs * 2.0;                  // ハートの間隔

  // ラベルを先に測ってパネル幅を中身に合わせる
  const wsum = weaponSummary();
  const label = 'Lv' + level + (wsum ? '  ' + wsum : '');
  ctx.font = `bold ${hs * 0.95}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const heartsW = sp * MAX_HEARTS + pad;
  const panelW = Math.max(heartsW, ctx.measureText(label).width + hs * 1.4);
  const panelH = (companions.length > 0 ? 7.0 : 5.6) * hs;

  // 下地
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  roundRect(pad * 0.4, pad * 0.4, panelW, panelH, hs * 0.55);
  ctx.fill();

  // ハート
  for (let i = 0; i < MAX_HEARTS; i++) {
    drawHeart(pad + hs + i * sp, pad + hs, hs, i < hearts ? '#FF5B6E' : 'rgba(0,0,0,0.15)');
  }

  // ゼリー数
  const jx = pad + hs, jy = pad + hs * 3.0;
  ctx.fillStyle = '#FFB84D';
  ctx.beginPath();
  ctx.moveTo(jx - hs * 0.7, jy - hs * 0.4);
  ctx.lineTo(jx + hs * 0.7, jy - hs * 0.4);
  ctx.lineTo(jx + hs * 0.5, jy + hs * 0.6);
  ctx.lineTo(jx - hs * 0.5, jy + hs * 0.6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#5C3317';
  ctx.font = `bold ${hs * 1.25}px sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('×' + jellies, jx + hs * 1.1, jy + hs * 0.1);

  // レベル＆経験値バー＆持っている武器
  const ex = pad * 0.9, ey = jy + hs * 1.7, ew = panelW - hs * 1.0, eh = hs * 0.44;
  ctx.fillStyle = '#5C3317';
  ctx.font = `bold ${hs * 0.95}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
  ctx.fillText(label, ex, ey - hs * 0.5);
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; roundRect(ex, ey, ew, eh, eh / 2); ctx.fill();
  ctx.fillStyle = '#7ED0FF';
  const ef = Math.min(1, exp / expToNext);
  roundRect(ex, ey, Math.max(eh, ew * ef), eh, eh / 2); ctx.fill();

  if (state === STATE.BOSS) {
    // ボスのHPバー（ステータス欄の下に配置）
    const bw = W * 0.56, bh = Math.min(W, H) * 0.028;
    const bx = W / 2 - bw / 2, by = pad * 0.4 + panelH + bh * 1.4;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${bh * 1.1}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ボス', W / 2, by - bh * 0.9);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
    const hpFrac = Math.max(0, boss.hp / boss.maxHp);
    const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    hg.addColorStop(0, '#FF3B4B'); hg.addColorStop(1, '#FF9A5B');
    ctx.fillStyle = hg;
    if (hpFrac > 0) { roundRect(bx, by, Math.max(bh, bw * hpFrac), bh, bh / 2); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = bh * 0.14;
    roundRect(bx, by, bw, bh, bh / 2); ctx.stroke();
  } else {
    // 進捗バー
    const bw = W * 0.5, bh = Math.min(W, H) * 0.02;
    const bx = W / 2 - bw / 2, by = pad + bh;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    roundRect(bx, by, bw, bh, bh / 2);
    ctx.fill();
    const prog = Math.min(1, scrollX / goalDist);
    ctx.fillStyle = '#6BCB77';
    roundRect(bx, by, Math.max(bh, bw * prog), bh, bh / 2);
    ctx.fill();
    // 旗アイコン
    ctx.font = `${bh * 2.2}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('🏁', bx + bw + bh * 1.8, by + bh * 0.6);
    // 進捗マーカー
    ctx.fillStyle = '#4A2C12';
    ctx.beginPath();
    ctx.arc(bx + bw * prog, by + bh / 2, bh * 1.1, 0, Math.PI * 2);
    ctx.fill();
  }

  // 仲間の数
  if (companions.length > 0) {
    ctx.fillStyle = '#2A6FB0';
    ctx.font = `bold ${hs * 0.95}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('なかま×' + companions.length + '/4', jx - hs * 0.6, jy + hs * 3.0);
  }
}

function drawHeart(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.7);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.2, x - s * 0.5, y - s * 0.9, x, y - s * 0.25);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 0.9, x + s * 1.1, y - s * 0.2, x, y + s * 0.7);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function overlay(alpha) {
  ctx.fillStyle = `rgba(80, 60, 30, ${alpha})`;
  ctx.fillRect(0, 0, W, H);
}

function bigText(text, y, size, color, stroke) {
  ctx.font = `bold ${size}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', 'Yu Gothic', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = size * 0.15;
    ctx.lineJoin = 'round';
    ctx.strokeText(text, W / 2, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
}

function pulse() { return 1 + Math.sin(stateTimer * 4) * 0.05; }

function drawTitle() {
  const base = Math.min(W, H);
  bigText('クワガタ', H * 0.2, base * 0.13, '#5C3317', '#FFF');
  bigText('フライング！', H * 0.33, base * 0.13, '#5C3317', '#FFF');
  // PUSH START（点滅）
  const blink = 0.5 + 0.5 * Math.sin(stateTimer * 4);
  ctx.save();
  ctx.globalAlpha = blink;
  bigText('PUSH START', H * 0.66, base * 0.075, '#FFF', '#E8743B');
  ctx.restore();
  bigText('がめんを タッチしてね', H * 0.76, base * 0.04, '#5C3317', '#FFF');
  bigText('おしてるあいだ うえにとぶよ', H * 0.85, base * 0.036, '#5C3317', '#FFF');
  bigText('みぎした の ボタンで こうげき！', H * 0.905, base * 0.036, '#5C3317', '#FFF');
}

function drawGoal() {
  overlay(0.25);
  const base = Math.min(W, H);
  const won = boss.defeated;
  bigText(won ? '🏆 クリア！ 🏆' : '🎉 ゴール！ 🎉', H * 0.28, base * 0.11, '#FFD93D', '#B8860B');
  bigText(won ? 'ボスをたおした！' : 'やったね！すごい！', H * 0.44, base * 0.07, '#FFF', '#E8743B');
  bigText('ゼリー ' + jellies + 'こ ／ なかま ' + companions.length + 'ひき', H * 0.57, base * 0.05, '#FFE0A3', '#8B5A2B');
  if (stateTimer > 0.6) {
    ctx.save();
    ctx.translate(W / 2, H * 0.75);
    ctx.scale(pulse(), pulse());
    ctx.translate(-W / 2, -H * 0.75);
    bigText('タッチで もういっかい！', H * 0.75, base * 0.05, '#FFF', '#4D96FF');
    ctx.restore();
  }
}

function drawRetry() {
  overlay(0.25);
  const base = Math.min(W, H);
  bigText('あちゃー！', H * 0.32, base * 0.1, '#FFF', '#E8743B');
  bigText('でも だいじょうぶ！', H * 0.46, base * 0.06, '#FFF', '#5C3317');
  if (stateTimer > 0.6) {
    ctx.save();
    ctx.translate(W / 2, H * 0.68);
    ctx.scale(pulse(), pulse());
    ctx.translate(-W / 2, -H * 0.68);
    bigText('タッチで もういっかい！', H * 0.68, base * 0.055, '#FFF', '#4D96FF');
    ctx.restore();
  }
}

function drawConfettiLayer() {
  if (state !== STATE.GOAL) return;
  for (const c of confetti) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.r, -c.r * 0.6, c.r * 2, c.r * 1.2);
    ctx.restore();
  }
}

// ---------- メインループ ----------
started = true;
if (W < 10 || H < 10) resize();   // まだサイズ未確定なら確定させる
resetGame();
state = STATE.TITLE;
stateTimer = 0;

let lastTime = 0;
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  if (W >= 10 && H >= 10) {   // 有効なサイズが取れている時だけ描画
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 開発時の動作確認用（?debug 付きURLのときだけ有効）
if (typeof location !== 'undefined' && location.search.indexOf('debug') >= 0) {
  window.__kuwagata = {
    beetle, boss, STAGES,
    doAttack,
    play(stg) { startStage(stg || 0); stateTimer = 1; },
    titleTap() { state = STATE.TITLE; stateTimer = 1; tryStart(); },
    setLevel(n) { level = n; beetle.power = n; },
    setWeapon(w) { beetle.weapons[w] = (beetle.weapons[w] || 0) + 1; },
    getWeapons() { return Object.assign({}, beetle.weapons); },
    forceLevelUp() { exp = expToNext; triggerLevelUp(); },
    pickChoice(i) { if (levelChoices[i]) applyUpgrade(levelChoices[i]); },
    addFriend() { addCompanion(); },
    gotoBoss() { startStage(0); startBoss(); },
    hurtBoss(n) { boss.hp -= (n || 1); if (boss.hp <= 0) bossDefeated(); },
    toggleMusic() { return Music.toggle(); },
    addObstacleAhead() {
      obstacles.push({ x: scrollX + beetle.x + beetle.size * 3, type: 'bottom', h: H * 0.3, w: Math.max(W, H) * 0.055, passed: false });
    },
    addEnemyAhead(y) {
      enemies.push({ x: scrollX + W * 0.7, y: y || H * 0.4, baseY: y || H * 0.4, hp: 3, maxHp: 3, fireCd: 0.2, bob: 0, hurt: 0, wing: 0 });
    },
    enemyFireAll() { for (const e of enemies) enemyFire(e.x - scrollX, e.y); },
    get state() { return state; },
    get stageIndex() { return stageIndex; },
    get level() { return level; },
    get weapon() { return weaponSummary(); },
    get hearts() { return hearts; },
    get choiceCount() { return levelChoices.length; },
    get companionCount() { return companions.length; },
    get enemyCount() { return enemies.length; },
    get shotCount() { return shots.length; },
    get enemyShotCount() { return shots.filter(s => s.side === 'enemy').length; },
    get obstacleCount() { return obstacles.length; }
  };
}

})();
</script>

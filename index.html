<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#87CEEB">
<title>クワガタ フライング！</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: #87CEEB;
  }
  #game {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
let started = false;
function measure() {
  // iframe や各種モバイル環境でも確実にサイズを取得する
  const w = window.innerWidth || document.documentElement.clientWidth || canvas.clientWidth || 0;
  const h = window.innerHeight || document.documentElement.clientHeight || canvas.clientHeight || 0;
  return { w, h };
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const m = measure();
  // サイズがまだ取れていなければ次のフレームで再試行（真っ黒画面の防止）
  if (m.w < 10 || m.h < 10) { requestAnimationFrame(resize); return; }
  const first = (W < 10 || H < 10);
  W = m.w;
  H = m.h;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 初めて有効なサイズが取れた時点でレイアウトを組み直す
  if (first && started) resetGame();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
window.addEventListener('load', resize);
resize();

// ---------- サウンド ----------
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, delay) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol || 0.15, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}
const sfx = {
  collect() { beep(880, 0.12, 'sine', 0.18); beep(1320, 0.18, 'sine', 0.15, 0.08); },
  powerup() { [660, 990, 1320, 1760].forEach((f, i) => beep(f, 0.18, 'triangle', 0.16, i * 0.05)); },
  hit() { beep(160, 0.25, 'square', 0.12); beep(110, 0.3, 'square', 0.1, 0.08); },
  attack() { beep(300, 0.08, 'sawtooth', 0.12); beep(180, 0.12, 'square', 0.1, 0.03); },
  smash() { beep(220, 0.15, 'square', 0.14); beep(140, 0.2, 'sawtooth', 0.12, 0.04); beep(660, 0.1, 'triangle', 0.1, 0.02); },
  goal() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.35, 'triangle', 0.18, i * 0.15));
  },
  start() { beep(660, 0.1, 'sine', 0.15); beep(880, 0.15, 'sine', 0.15, 0.1); },
  heart() { beep(440, 0.15, 'triangle', 0.12); }
};

// ---------- 音楽（スーパーファミコン風チップチューン） ----------
function noteFreq(n) {
  if (!n) return 0;
  const map = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  const m = /^([A-G]#?)(-?\d)$/.exec(n);
  if (!m) return 0;
  const midi = map[m[1]] + (parseInt(m[2], 10) + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
let _noiseBuf = null;
function noiseBuffer() {
  if (_noiseBuf || !audioCtx) return _noiseBuf;
  const len = Math.floor(audioCtx.sampleRate * 0.3);
  _noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = _noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return _noiseBuf;
}

// 各曲：4本のトラック（lead / bass / arp / drum）を並行演奏。[音名, 拍数]の配列。
const SONGS = {
  main: {
    bpm: 142,
    tracks: [
      { inst: 'lead', vol: 0.9, seq: [
        ['G5',0.5],['E5',0.5],['C5',0.5],['E5',0.5],['G5',1],['C6',1],
        ['B5',0.5],['G5',0.5],['D5',0.5],['G5',0.5],['B5',1],['D6',1],
        ['C6',0.5],['A5',0.5],['E5',0.5],['A5',0.5],['C6',1],['A5',1],
        ['A5',0.5],['F5',0.5],['C5',0.5],['F5',0.5],['A5',1],['G5',1] ] },
      { inst: 'bass', vol: 0.8, seq: [
        ['C3',0.5],['C3',0.5],['G3',0.5],['C3',0.5],['C3',0.5],['C3',0.5],['G3',0.5],['E3',0.5],
        ['G2',0.5],['G2',0.5],['D3',0.5],['G2',0.5],['G2',0.5],['G2',0.5],['D3',0.5],['B2',0.5],
        ['A2',0.5],['A2',0.5],['E3',0.5],['A2',0.5],['A2',0.5],['A2',0.5],['E3',0.5],['C3',0.5],
        ['F2',0.5],['F2',0.5],['C3',0.5],['F2',0.5],['F2',0.5],['F2',0.5],['C3',0.5],['A2',0.5] ] },
      { inst: 'arp', vol: 0.5, seq: [
        ['C4',0.5],['E4',0.5],['G4',0.5],['E4',0.5],['C4',0.5],['E4',0.5],['G4',0.5],['E4',0.5],
        ['B3',0.5],['D4',0.5],['G4',0.5],['D4',0.5],['B3',0.5],['D4',0.5],['G4',0.5],['D4',0.5],
        ['A3',0.5],['C4',0.5],['E4',0.5],['C4',0.5],['A3',0.5],['C4',0.5],['E4',0.5],['C4',0.5],
        ['F3',0.5],['A3',0.5],['C4',0.5],['A3',0.5],['F3',0.5],['A3',0.5],['C4',0.5],['A3',0.5] ] },
      { inst: 'drum', vol: 0.9, seq: [
        ['K',0.5],['H',0.5],['S',0.5],['H',0.5],['K',0.5],['H',0.5],['S',0.5],['H',0.5] ] }
    ]
  },
  boss: {
    bpm: 158,
    tracks: [
      { inst: 'lead', vol: 0.95, seq: [
        ['A5',0.5],['A5',0.5],['C6',0.5],['A5',0.5],['E5',1],['A5',1],
        ['F5',0.5],['F5',0.5],['A5',0.5],['F5',0.5],['C5',1],['F5',1],
        ['G5',0.5],['G5',0.5],['B5',0.5],['G5',0.5],['D5',1],['G5',1],
        ['G#5',0.5],['B5',0.5],['E6',0.5],['B5',0.5],['G#5',1],['E5',1] ] },
      { inst: 'bass', vol: 0.85, seq: [
        ['A2',0.5],['A2',0.5],['A3',0.5],['A2',0.5],['A2',0.5],['A2',0.5],['A3',0.5],['A2',0.5],
        ['F2',0.5],['F2',0.5],['F3',0.5],['F2',0.5],['F2',0.5],['F2',0.5],['F3',0.5],['F2',0.5],
        ['G2',0.5],['G2',0.5],['G3',0.5],['G2',0.5],['G2',0.5],['G2',0.5],['G3',0.5],['G2',0.5],
        ['E2',0.5],['E2',0.5],['E3',0.5],['E2',0.5],['E2',0.5],['E2',0.5],['B2',0.5],['E3',0.5] ] },
      { inst: 'arp', vol: 0.5, seq: [
        ['A3',0.5],['C4',0.5],['E4',0.5],['C4',0.5],['A3',0.5],['C4',0.5],['E4',0.5],['C4',0.5],
        ['F3',0.5],['A3',0.5],['C4',0.5],['A3',0.5],['F3',0.5],['A3',0.5],['C4',0.5],['A3',0.5],
        ['G3',0.5],['B3',0.5],['D4',0.5],['B3',0.5],['G3',0.5],['B3',0.5],['D4',0.5],['B3',0.5],
        ['E3',0.5],['G#3',0.5],['B3',0.5],['G#3',0.5],['E3',0.5],['G#3',0.5],['B3',0.5],['G#3',0.5] ] },
      { inst: 'drum', vol: 1.0, seq: [
        ['K',0.5],['H',0.5],['S',0.5],['H',0.5],['K',0.5],['K',0.5],['S',0.5],['H',0.5] ] }
    ]
  }
};

const Music = {
  enabled: true,
  playing: false,
  name: null,
  bpm: 140,
  tracks: [],
  timer: null,
  masterVol: 0.3,
  start(name) {
    if (!audioCtx || !this.enabled) { this.name = name; return; }
    if (this.playing && this.name === name) return;
    this.stop();
    const song = SONGS[name];
    if (!song) return;
    this.name = name;
    this.bpm = song.bpm;
    const t0 = audioCtx.currentTime + 0.12;
    this.tracks = song.tracks.map(tr => ({ seq: tr.seq, inst: tr.inst, vol: tr.vol, idx: 0, next: t0 }));
    this.playing = true;
    this._tick();
  },
  stop() {
    this.playing = false;
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
  },
  toggle() {
    this.enabled = !this.enabled;
    if (!this.enabled) this.stop();
    else if (this.name) { const n = this.name; this.name = null; this.start(n); }
    return this.enabled;
  },
  _tick() {
    if (!this.playing || !audioCtx) return;
    const ahead = audioCtx.currentTime + 0.25;
    for (const t of this.tracks) {
      while (t.next < ahead) {
        const ev = t.seq[t.idx % t.seq.length];
        const dur = ev[1] * 60 / this.bpm;
        if (ev[0]) {
          if (t.inst === 'drum') this._drum(ev[0], t.next, t.vol);
          else this._note(t.inst, noteFreq(ev[0]), t.next, dur, t.vol);
        }
        t.next += dur;
        t.idx++;
      }
    }
    this.timer = setTimeout(() => this._tick(), 45);
  },
  _note(inst, freq, time, dur, vol) {
    if (!freq) return;
    const g = audioCtx.createGain();
    const osc = audioCtx.createOscillator();
    let type = 'square', a = 0.006, rel = 0.06, sus = 0.6, peak = vol * this.masterVol;
    if (inst === 'bass') { type = 'triangle'; peak *= 1.4; sus = 0.75; }
    else if (inst === 'arp') { type = 'square'; peak *= 0.5; rel = 0.04; }
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    const end = time + dur;
    const hold = Math.max(0.05, dur * 0.85);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(peak, time + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * sus), time + a + hold * 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, end + rel);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(time); osc.stop(end + rel + 0.02);
  },
  _drum(sym, time, vol) {
    const V = vol * this.masterVol;
    if (sym === 'K') {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(165, time);
      o.frequency.exponentialRampToValueAtTime(45, time + 0.12);
      g.gain.setValueAtTime(V * 1.3, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);
      o.connect(g); g.connect(audioCtx.destination); o.start(time); o.stop(time + 0.18);
    } else if (sym === 'S' || sym === 'H') {
      const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer();
      const g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = sym === 'S' ? 1200 : 6500;
      const len = sym === 'S' ? 0.14 : 0.05;
      g.gain.setValueAtTime(sym === 'S' ? V : V * 0.55, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + len);
      src.connect(f); f.connect(g); g.connect(audioCtx.destination);
      src.start(time); src.stop(time + len + 0.02);
    }
  }
};

// ---------- ゲーム状態 ----------
const STATE = { TITLE: 0, PLAY: 1, GOAL: 2, RETRY: 3, BOSS: 4 };
let state = STATE.TITLE;
let pressing = false;

const beetle = {
  x: 0, y: 0, vy: 0,
  size: 0,          // 半径ベース
  wingPhase: 0,
  invincible: 0,    // 無敵時間（秒）
  tilt: 0,
  atkCd: 0,         // 攻撃のクールダウン（秒）
  atkAnim: 0,       // 攻撃モーションの残り時間（秒）
  power: 0          // 強化レベル（ゼリーの数と連動）
};

let scrollX = 0;         // 進んだ距離
let goalDist = 0;        // ゴールまでの距離
let speed = 0;           // スクロール速度 px/s
let hearts = 5;
const MAX_HEARTS = 5;
let jellies = 0;
let obstacles = [];      // {x, type, h, w, passed}
let items = [];          // {x, y, taken, bob}
let clouds = [];
let trees = [];
let particles = [];
let confetti = [];
let shake = 0;
let goalTimer = 0;
let stateTimer = 0;
let companions = [];     // 仲間の虫
let enemies = [];        // 道中の敵キャラ
let shots = [];          // 弾 {x,y,vx,vy,r,side,dmg,color,spin,pierce}
let bossBanner = 0;      // 「ボスとうじょう！」表示
const boss = {
  active: false, defeated: false,
  x: 0, y: 0, size: 0,
  hp: 0, maxHp: 0,
  introT: 0, fireCd: 0, bob: 0, hurt: 0
};

function courseSetup() {
  speed = Math.max(W, H) * 0.20;          // 画面サイズに応じたやさしい速度
  const spacing = speed * 3.0;             // 障害物の間隔（約3秒ごと）
  const count = 18;                        // 障害物の数
  goalDist = spacing * (count + 2);

  obstacles = [];
  items = [];
  for (let i = 0; i < count; i++) {
    const x = spacing * (i + 2);
    const type = Math.random() < 0.5 ? 'top' : 'bottom';
    // 障害物の長さ：通れるすき間を画面の55%以上残す
    const h = H * (0.18 + Math.random() * 0.22);
    obstacles.push({ x, type, h, w: Math.max(W, H) * 0.055, passed: false });
    // 障害物の間にアイテムを置く（ときどき「仲間」の虫）
    if (i < count - 1) {
      const ix = x + spacing * 0.5;
      const safeTop = H * 0.2, safeBottom = H * 0.75;
      const iy = safeTop + Math.random() * (safeBottom - safeTop);
      const kind = (i === 3 || i === 8 || i === 13) ? 'friend' : 'jelly';
      items.push({ x: ix, y: iy, taken: false, bob: Math.random() * Math.PI * 2, kind });
    }
  }

  // 道中の敵キャラ（スズメバチ）を配置
  enemies = [];
  for (let k = 0; k < 6; k++) {
    const ex = spacing * (3.4 + k * 2.4);
    const ey = H * (0.22 + Math.random() * 0.42);
    enemies.push({ x: ex, y: ey, baseY: ey, hp: 3, maxHp: 3, fireCd: 1.6 + Math.random() * 1.2, bob: Math.random() * 6, hurt: 0, wing: 0 });
  }

  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({ x: Math.random() * W * 2, y: H * (0.05 + Math.random() * 0.3), s: 0.5 + Math.random() * 0.8 });
  }
  trees = [];
  for (let i = 0; i < 14; i++) {
    trees.push({ x: Math.random() * W * 3, s: 0.6 + Math.random() * 0.7 });
  }
}

function resetGame() {
  scrollX = 0;
  hearts = MAX_HEARTS;
  jellies = 0;
  beetle.x = W * 0.24;
  beetle.y = H * 0.45;
  beetle.vy = 0;
  beetle.size = Math.min(W, H) * 0.055;
  beetle.invincible = 0;
  beetle.atkCd = 0;
  beetle.atkAnim = 0;
  beetle.power = 0;
  particles = [];
  confetti = [];
  companions = [];
  enemies = [];
  shots = [];
  boss.active = false;
  boss.defeated = false;
  bossBanner = 0;
  shake = 0;
  courseSetup();
}

// ---------- 攻撃ボタン（右下） ----------
function attackButton() {
  const r = Math.min(W, H) * 0.1;
  return { x: W - r - Math.min(W, H) * 0.04, y: H - r - Math.min(W, H) * 0.05, r };
}
function inButton(x, y) {
  const b = attackButton();
  const dx = x - b.x, dy = y - b.y;
  return dx * dx + dy * dy <= (b.r * 1.2) * (b.r * 1.2);
}
// ---------- 音楽ボタン（右上） ----------
function musicButton() {
  const r = Math.min(W, H) * 0.05;
  return { x: W - r - Math.min(W, H) * 0.03, y: r + Math.min(W, H) * 0.03, r };
}
function inMusicButton(x, y) {
  const b = musicButton();
  const dx = x - b.x, dy = y - b.y;
  return dx * dx + dy * dy <= (b.r * 1.35) * (b.r * 1.35);
}

// 障害物を壊す（配列インデックス指定）
function smashObstacleIndex(i) {
  const ob = obstacles[i];
  if (!ob) return;
  const sx = ob.x - scrollX;
  const groundY = H * 0.88;
  const cy = ob.type === 'top' ? ob.h * 0.6 : groundY - ob.h * 0.6;
  const col = ob.type === 'top' ? '#5B9E4D' : '#E85D5D';
  burstParticles(sx, cy, col, 18);
  burstParticles(sx, cy, '#FFE0A3', 6);
  obstacles.splice(i, 1);
  sfx.smash();
}
// あるx（画面座標）の前方にある障害物を探す
function findObstacleAhead(fromX, back, reach) {
  for (let i = 0; i < obstacles.length; i++) {
    const sx = obstacles[i].x - scrollX;
    const w = obstacles[i].w;
    if (sx + w / 2 > fromX - back && sx - w / 2 < fromX + reach) return i;
  }
  return -1;
}

// 弾を発射（プレイヤーの弾はボスへ向かって飛ぶ＝小さな子でも当てやすい）
// pierce = 何個の障害物を貫通して壊せるか
function fireShot(x, y, side, dmg, color, pierce) {
  const sp = Math.max(W, H) * (side === 'player' ? 0.95 : 0.5);
  let vx, vy = 0;
  if (side === 'player') {
    if (boss.active && !boss.defeated) {
      const a = Math.atan2(boss.y - y, boss.x - x);
      vx = Math.cos(a) * sp; vy = Math.sin(a) * sp;
    } else { vx = sp; }
  } else { vx = -sp; }
  const r = beetle.size * (side === 'player' ? 0.4 + Math.min(beetle.power, 12) * 0.02 : 0.36);
  shots.push({
    x, y, r, vx, vy,
    side, dmg, color: color || (side === 'player' ? '#FFE873' : '#FF5B6E'), spin: 0, pierce: pierce || 1
  });
  // 発射のマズルフラッシュ
  if (side === 'player') burstParticles(x, y, '#FFF3B0', 6);
}

function doAttack() {
  if (beetle.atkCd > 0) return;
  // 通常ステージもボスステージも同じ仕様：前方へ光の弾を1発撃つ
  const bossReady = state === STATE.BOSS && boss.active && !boss.defeated && boss.introT <= 0;
  if (state === STATE.PLAY || bossReady) {
    beetle.atkCd = 0.42;
    beetle.atkAnim = 0.3;
    sfx.attack();
    const dmg = 1 + Math.floor(beetle.power / 4);
    fireShot(beetle.x + beetle.size * 2, beetle.y, 'player', dmg, '#FFE873', 1);
  }
}

// ---------- 入力 ----------
let pointers = new Map();   // id -> 'fly' | 'atk'
function refreshPressing() {
  pressing = [...pointers.values()].includes('fly');
}
function tryStart() {
  if (state === STATE.TITLE || state === STATE.GOAL || state === STATE.RETRY) {
    if (stateTimer > 0.6) {   // 誤タップ防止に少し待つ
      resetGame();
      state = STATE.PLAY;
      sfx.start();
      Music.start('main');
    }
    return true;
  }
  return false;
}
function pointerDown(id, x, y) {
  initAudio();
  if (inMusicButton(x, y)) { Music.toggle(); return; }   // 音楽ON/OFF
  if (tryStart()) return;             // タイトル等ではどこを押しても開始
  if (inButton(x, y)) {
    pointers.set(id, 'atk');
    doAttack();
  } else {
    pointers.set(id, 'fly');
    refreshPressing();
  }
}
function pointerUp(id) {
  pointers.delete(id);
  refreshPressing();
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) pointerDown(t.identifier, t.clientX, t.clientY);
}, { passive: false });
function touchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) pointerUp(t.identifier);
}
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });
canvas.addEventListener('mousedown', (e) => pointerDown('mouse', e.clientX, e.clientY));
window.addEventListener('mouseup', () => pointerUp('mouse'));
// キーボード：スペース/↑で飛行、X/Enterで攻撃
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (!tryStart()) { pointers.set('key', 'fly'); refreshPressing(); }
  } else if (e.code === 'KeyX' || e.code === 'Enter') {
    if (!tryStart()) doAttack();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') pointerUp('key');
});
function attackHeld() { return [...pointers.values()].includes('atk'); }

// ---------- 更新 ----------
function update(dt) {
  stateTimer += dt;
  beetle.wingPhase += dt * (pressing ? 40 : 18);

  if (state === STATE.BOSS) { updateBoss(dt); return; }

  if (state !== STATE.PLAY) {
    // タイトル画面などではふわふわ浮かぶ
    beetle.y = H * 0.42 + Math.sin(stateTimer * 2) * H * 0.02;
    updateDecor(dt, 0.3);
    updateParticles(dt);
    updateConfetti(dt);
    return;
  }

  // 飛行の物理：押している間は上昇、離すと下降
  const up = H * 1.15;      // 上昇加速度
  const gravity = H * 0.95; // 重力
  if (pressing) beetle.vy -= up * dt;
  else beetle.vy += gravity * dt;
  const vmax = H * 0.55;
  beetle.vy = Math.max(-vmax, Math.min(vmax, beetle.vy));
  beetle.y += beetle.vy * dt;
  beetle.tilt = beetle.vy / vmax * 0.4;

  // 画面の上下では止まる（落ちてもミスにならない・やさしい設計）
  const groundY = H * 0.88;
  if (beetle.y < beetle.size * 1.2) { beetle.y = beetle.size * 1.2; beetle.vy = Math.max(0, beetle.vy); }
  if (beetle.y > groundY - beetle.size) { beetle.y = groundY - beetle.size; beetle.vy = Math.min(0, beetle.vy); }

  // スクロール
  scrollX += speed * dt;
  updateDecor(dt, 1);

  if (beetle.invincible > 0) beetle.invincible -= dt;
  if (beetle.atkCd > 0) beetle.atkCd -= dt;
  if (beetle.atkAnim > 0) beetle.atkAnim -= dt;
  if (shake > 0) shake -= dt * 3;

  // 攻撃ボタンを押しっぱなしにすると連続で攻撃
  if (attackHeld() && beetle.atkCd <= 0) doAttack();

  updateCompanions(dt);
  updateEnemies(dt);
  updateShots(dt);

  // 飛行のキラキラ
  if (pressing && Math.random() < 0.3) {
    particles.push({
      x: beetle.x - beetle.size, y: beetle.y + beetle.size * 0.5,
      vx: -60 - Math.random() * 60, vy: 30 + Math.random() * 50,
      life: 0.5, maxLife: 0.5, color: '#FFF8B0', r: 3 + Math.random() * 3
    });
  }

  // ※ 障害物に当たってもダメージは受けない（壊す対象）

  // ゼリー取得
  for (const it of items) {
    if (it.taken) continue;
    it.bob += dt * 3;
    const sx = it.x - scrollX;
    if (sx < -50 || sx > W + 50) continue;
    const iy = it.y + Math.sin(it.bob) * 8;
    const dx = beetle.x - sx, dy = beetle.y - iy;
    const r = beetle.size + Math.min(W, H) * 0.035;
    if (dx * dx + dy * dy < r * r) {
      it.taken = true;
      if (it.kind === 'friend') {
        addCompanion();                         // 仲間が参戦！
        sfx.powerup();
        burstParticles(sx, iy, '#8BD1FF', 18);
        burstParticles(beetle.x, beetle.y, '#FFFFFF', 12);
      } else {
        jellies++;
        beetle.power = jellies;                 // ゼリーを取るごとに強化
        sfx.collect();
        sfx.powerup();
        burstParticles(sx, iy, '#FFB84D', 14);
        burstParticles(beetle.x, beetle.y, '#FFE873', 16);   // クワガタが光る
      }
    }
  }

  // ゴールに到達 → ボスステージへ
  if (scrollX >= goalDist) {
    startBoss();
  }

  updateParticles(dt);
}

// ---------- 仲間の虫 ----------
function addCompanion() {
  const types = ['ladybug', 'bee', 'ant'];
  const i = companions.length;
  companions.push({
    type: types[i % types.length],
    x: beetle.x, y: beetle.y,
    idx: i, atkCd: 0.6 + Math.random() * 0.6, t: Math.random() * Math.PI * 2, wing: 0
  });
}
function updateCompanions(dt) {
  const n = companions.length;
  for (const c of companions) {
    c.t += dt;
    c.wing += dt * 30;
    // クワガタの周りをまわる
    const ang = c.t * 1.5 + c.idx * (Math.PI * 2 / Math.max(1, n));
    const rad = beetle.size * (2.3 + (c.idx % 3) * 0.55);
    const tx = beetle.x - beetle.size * 0.5 + Math.cos(ang) * rad;
    const ty = beetle.y + Math.sin(ang) * rad * 0.7;
    c.x += (tx - c.x) * Math.min(1, dt * 8);
    c.y += (ty - c.y) * Math.min(1, dt * 8);

    c.atkCd -= dt;
    if (c.atkCd <= 0) {
      // 通常ステージもボスステージも同じ仕様：仲間も前方へ弾を撃つ
      const bossNotReady = state === STATE.BOSS && (!boss.active || boss.defeated || boss.introT > 0);
      if (bossNotReady) {
        c.atkCd = 0.4;   // ボス登場前は撃たない
      } else {
        fireShot(c.x, c.y, 'player', 1, '#FF8A5B', 1);
        c.atkCd = 1.0;
      }
    }
  }
}

// ---------- ボスステージ ----------
function startBoss() {
  state = STATE.BOSS;
  stateTimer = 0;
  bossBanner = 2.2;
  boss.active = true;
  boss.defeated = false;
  boss.size = Math.min(W, H) * 0.17;
  boss.maxHp = 130;
  boss.hp = 130;
  boss.x = W + boss.size;
  boss.y = H * 0.42;
  boss.introT = 1.6;
  boss.fireCd = 2.2;
  boss.bob = 0;
  boss.hurt = 0;
  shots = [];
  enemies = [];
  beetle.x = W * 0.16;
  beetle.vy = 0;
  beetle.invincible = 1.2;
  Music.start('boss');
}
function bossDefeated() {
  boss.defeated = true;
  boss.hp = 0;
  state = STATE.GOAL;
  stateTimer = 0;
  Music.stop();
  sfx.goal();
  for (let i = 0; i < 120; i++) spawnConfetti();
  burstParticles(boss.x, boss.y, '#FFE873', 40);
  burstParticles(boss.x, boss.y, '#FF9A5B', 30);
}
function bossFire() {
  const bx = boss.x - boss.size * 0.55, by = boss.y;
  const ang = Math.atan2(beetle.y - by, beetle.x - bx);
  const sp = Math.max(W, H) * 0.42;
  for (const off of [-0.2, 0, 0.2]) {
    const a = ang + off;
    shots.push({ x: bx, y: by, r: boss.size * 0.13, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, side: 'enemy', dmg: 1, color: '#FF5B6E', spin: 0, pierce: 1 });
  }
  sfx.attack();
}

// プレイヤーがダメージを受ける（敵の攻撃・敵との接触）
function damagePlayer() {
  if (beetle.invincible > 0) return;
  hearts--;
  beetle.invincible = 1.6;
  shake = 1;
  sfx.hit();
  burstParticles(beetle.x, beetle.y, '#FF8888', 12);
  if (hearts <= 0) { state = STATE.RETRY; stateTimer = 0; Music.stop(); }
}

// ---------- 道中の敵 ----------
function enemyFire(sx, ey) {
  const ang = Math.atan2(beetle.y - ey, beetle.x - sx);
  const sp = Math.max(W, H) * 0.38;
  shots.push({ x: sx, y: ey, r: beetle.size * 0.34, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, side: 'enemy', dmg: 1, color: '#C060E8', spin: 0, pierce: 1 });
  sfx.attack();
}
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const sx = e.x - scrollX;
    e.wing += dt * 30;
    if (e.hurt > 0) e.hurt -= dt;
    if (sx < -H * 0.25) { enemies.splice(i, 1); continue; }   // 画面左に流れて退場
    if (sx > W + H * 0.2) continue;                            // まだ右で登場前
    e.bob += dt;
    e.y = e.baseY + Math.sin(e.bob * 1.4) * H * 0.06;
    // 画面内かつプレイヤーより前（右）にいるとき攻撃
    if (sx < W * 0.96 && sx > beetle.x - beetle.size) {
      e.fireCd -= dt;
      if (e.fireCd <= 0) { enemyFire(sx, e.y); e.fireCd = 2.0 + Math.random() * 0.9; }
    }
    // 接触ダメージ
    const dx = beetle.x - sx, dy = beetle.y - e.y;
    const rr = beetle.size * 0.6 + Math.min(W, H) * 0.045;
    if (dx * dx + dy * dy < rr * rr) damagePlayer();
  }
}

function updateShots(dt) {
  const groundY = H * 0.88;
  // 移動＆画面外判定
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.spin += dt * 12;
    if (s.x < -80 || s.x > W + 80 || s.y < -80 || s.y > H + 80) s.dead = true;
  }
  for (const s of shots) {
    if (s.dead) continue;
    if (s.side === 'player') {
      // 敵の弾を打ち消す
      for (const o of shots) {
        if (o === s || o.dead || o.side === 'player') continue;
        const dx = s.x - o.x, dy = s.y - o.y, rr = s.r + o.r;
        if (dx * dx + dy * dy < rr * rr) {
          s.dead = true; o.dead = true;
          burstParticles((s.x + o.x) / 2, (s.y + o.y) / 2, '#FFFFFF', 8);
          break;
        }
      }
      if (s.dead) continue;
      // ボスに当たる（縦長判定で当てやすく）
      if (boss.active && !boss.defeated && boss.introT <= 0) {
        const dx = (s.x - boss.x) / (boss.size * 1.0);
        const dy = (s.y - boss.y) / (boss.size * 1.25);
        if (dx * dx + dy * dy < 1) {
          boss.hp -= s.dmg; boss.hurt = 0.16; sfx.smash();
          burstParticles(s.x, s.y, '#FFE873', 10);
          s.dead = true;
          if (boss.hp <= 0) bossDefeated();
          continue;
        }
      }
      // 敵に当たる
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j], ex = e.x - scrollX;
        const dx = s.x - ex, dy = s.y - e.y, rr = Math.min(W, H) * 0.05 + s.r;
        if (dx * dx + dy * dy < rr * rr) {
          e.hp -= s.dmg; e.hurt = 0.15;
          burstParticles(s.x, s.y, '#FFE873', 8);
          s.dead = true;
          if (e.hp <= 0) { burstParticles(ex, e.y, '#C060E8', 20); sfx.smash(); enemies.splice(j, 1); }
          break;
        }
      }
      if (s.dead) continue;
      // 障害物に当たったら壊す（強化で複数貫通）
      for (let j = obstacles.length - 1; j >= 0; j--) {
        const ob = obstacles[j];
        const sx = ob.x - scrollX;
        const oy0 = ob.type === 'top' ? 0 : groundY - ob.h;
        const oy1 = ob.type === 'top' ? ob.h : groundY;
        if (s.x > sx - ob.w / 2 - s.r && s.x < sx + ob.w / 2 + s.r &&
            s.y > oy0 - s.r && s.y < oy1 + s.r) {
          smashObstacleIndex(j);
          shake = Math.max(shake, 0.4);
          s.pierce--;
          if (s.pierce <= 0) { s.dead = true; break; }
        }
      }
    } else {
      // 敵の弾：プレイヤーに当たる
      const dx = s.x - beetle.x, dy = s.y - beetle.y;
      const rr = beetle.size * 0.6 + s.r;
      if (dx * dx + dy * dy < rr * rr) { damagePlayer(); s.dead = true; }
    }
  }
  // 死んだ弾を除去
  for (let i = shots.length - 1; i >= 0; i--) if (shots[i].dead) shots.splice(i, 1);
}
function updateBoss(dt) {
  // 飛行（上下移動のみ・スクロールなし）
  const up = H * 1.15, gravity = H * 0.95, vmax = H * 0.55;
  if (pressing) beetle.vy -= up * dt; else beetle.vy += gravity * dt;
  beetle.vy = Math.max(-vmax, Math.min(vmax, beetle.vy));
  beetle.y += beetle.vy * dt;
  beetle.tilt = beetle.vy / vmax * 0.4;
  const groundY = H * 0.88;
  if (beetle.y < beetle.size * 1.2) { beetle.y = beetle.size * 1.2; beetle.vy = Math.max(0, beetle.vy); }
  if (beetle.y > groundY - beetle.size) { beetle.y = groundY - beetle.size; beetle.vy = Math.min(0, beetle.vy); }

  if (beetle.invincible > 0) beetle.invincible -= dt;
  if (beetle.atkCd > 0) beetle.atkCd -= dt;
  if (beetle.atkAnim > 0) beetle.atkAnim -= dt;
  if (shake > 0) shake -= dt * 3;
  if (boss.hurt > 0) boss.hurt -= dt;
  if (bossBanner > 0) bossBanner -= dt;

  if (boss.introT > 0) {
    boss.introT -= dt;
    boss.x += (W * 0.8 - boss.x) * Math.min(1, dt * 3);
  } else if (!boss.defeated) {
    boss.bob += dt;
    boss.y = H * 0.42 + Math.sin(boss.bob * 1.2) * H * 0.14;
    boss.x = W * 0.8 + Math.sin(boss.bob * 0.6) * W * 0.02;
    boss.fireCd -= dt;
    if (boss.fireCd <= 0) {
      bossFire();
      // HPが減るほど攻撃が激しくなる
      boss.fireCd = 1.5 - (1 - boss.hp / boss.maxHp) * 0.7;
    }
  }

  if (attackHeld() && beetle.atkCd <= 0) doAttack();

  updateCompanions(dt);
  updateShots(dt);
  updateDecor(dt, 0.12);
  updateParticles(dt);
  updateConfetti(dt);

  if (pressing && Math.random() < 0.3) {
    particles.push({ x: beetle.x - beetle.size, y: beetle.y + beetle.size * 0.5, vx: -70, vy: 40, life: 0.5, maxLife: 0.5, color: '#FFF8B0', r: 3 });
  }
}

function updateDecor(dt, mul) {
  for (const c of clouds) {
    c.x -= speed * 0.15 * c.s * dt * mul;
    if (c.x < -200) { c.x = W + 200; c.y = H * (0.05 + Math.random() * 0.3); }
  }
  for (const t of trees) {
    t.x -= speed * 0.45 * t.s * dt * mul;
    if (t.x < -150) { t.x = W + 150 + Math.random() * 200; }
  }
}

function burstParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 180;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.6, maxLife: 0.6, color, r: 3 + Math.random() * 4
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function spawnConfetti() {
  confetti.push({
    x: Math.random() * W, y: -20 - Math.random() * H,
    vy: 80 + Math.random() * 120, vx: -40 + Math.random() * 80,
    r: 4 + Math.random() * 6, rot: Math.random() * Math.PI * 2, vr: -4 + Math.random() * 8,
    color: ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF9F45', '#C780FA'][Math.floor(Math.random() * 6)]
  });
}
function updateConfetti(dt) {
  for (const c of confetti) {
    c.y += c.vy * dt;
    c.x += c.vx * dt + Math.sin(c.y * 0.02) * 1.5;
    c.rot += c.vr * dt;
    if (c.y > H + 20) { c.y = -20; c.x = Math.random() * W; }
  }
}

// ---------- 描画 ----------
function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);
  }

  drawBackground();
  if (state === STATE.BOSS) {
    drawBoss();
    drawShots();
    drawParticles();
    drawCompanions();
    drawBeetle();
  } else {
    drawObstacles();
    drawItems();
    drawGoalFlag();
    drawEnemies();
    drawShots();
    drawParticles();
    drawCompanions();
    drawBeetle();
  }
  drawHUD();
  drawAttackButton();
  drawMusicButton();

  ctx.restore();

  if (state === STATE.TITLE) drawTitle();
  else if (state === STATE.GOAL) drawGoal();
  else if (state === STATE.RETRY) drawRetry();
  if (state === STATE.BOSS && bossBanner > 0) drawBossBanner();

  drawConfettiLayer();
}

function drawBackground() {
  const bossArena = (state === STATE.BOSS);
  // 空（ボス戦は夕暮れ〜暗い空でドラマチックに）
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  if (bossArena) {
    sky.addColorStop(0, '#3A2A5A');
    sky.addColorStop(0.6, '#7B4A6E');
    sky.addColorStop(1, '#C88A5A');
  } else {
    sky.addColorStop(0, '#7EC8F0');
    sky.addColorStop(0.7, '#BDE8FF');
    sky.addColorStop(1, '#E8F9E8');
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 太陽（ボス戦は赤い月）
  ctx.fillStyle = bossArena ? '#F2C24B' : '#FFE873';
  ctx.beginPath();
  ctx.arc(W * 0.85, H * 0.13, Math.min(W, H) * 0.07, 0, Math.PI * 2);
  ctx.fill();

  // 雲
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (const c of clouds) {
    const s = c.s * Math.min(W, H) * 0.05;
    ctx.beginPath();
    ctx.arc(c.x, c.y, s, 0, Math.PI * 2);
    ctx.arc(c.x + s * 0.9, c.y - s * 0.3, s * 0.8, 0, Math.PI * 2);
    ctx.arc(c.x + s * 1.8, c.y, s * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }

  // 遠くの木々
  const groundY = H * 0.88;
  for (const t of trees) {
    const s = t.s * Math.min(W, H) * 0.09;
    ctx.fillStyle = t.s > 1 ? '#4C9A50' : '#6DBB6F';
    ctx.beginPath();
    ctx.moveTo(t.x, groundY - s * 2.4);
    ctx.lineTo(t.x - s, groundY);
    ctx.lineTo(t.x + s, groundY);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8B5A2B';
    ctx.fillRect(t.x - s * 0.12, groundY - s * 0.2, s * 0.24, s * 0.2);
  }

  // 地面
  ctx.fillStyle = '#7BC47F';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = '#5FAE63';
  const off = -(scrollX * 0.9) % 60;
  for (let x = off; x < W + 60; x += 60) {
    ctx.beginPath();
    ctx.arc(x, groundY + 4, 20, Math.PI, 0);
    ctx.fill();
  }
}

function drawObstacles() {
  const groundY = H * 0.88;
  for (const ob of obstacles) {
    const sx = ob.x - scrollX;
    if (sx < -ob.w * 3 || sx > W + ob.w * 3) continue;
    if (ob.type === 'top') {
      // 上から垂れる木の枝＋葉っぱ
      ctx.fillStyle = '#8B5A2B';
      roundRect(sx - ob.w / 2, -10, ob.w, ob.h + 10, ob.w * 0.3);
      ctx.fill();
      ctx.fillStyle = '#5B9E4D';
      ctx.beginPath();
      ctx.arc(sx, ob.h, ob.w * 0.95, 0, Math.PI * 2);
      ctx.arc(sx - ob.w * 0.8, ob.h - ob.w * 0.5, ob.w * 0.7, 0, Math.PI * 2);
      ctx.arc(sx + ob.w * 0.8, ob.h - ob.w * 0.5, ob.w * 0.7, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 下から生えるキノコ
      const capR = ob.w * 1.15;
      ctx.fillStyle = '#F5E6C8';
      roundRect(sx - ob.w / 2, groundY - ob.h + capR * 0.4, ob.w, ob.h, ob.w * 0.3);
      ctx.fill();
      ctx.fillStyle = '#E85D5D';
      ctx.beginPath();
      ctx.arc(sx, groundY - ob.h + capR * 0.55, capR, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(sx - capR * 0.4, groundY - ob.h + capR * 0.25, capR * 0.16, 0, Math.PI * 2);
      ctx.arc(sx + capR * 0.35, groundY - ob.h + capR * 0.32, capR * 0.13, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawItems() {
  const s = Math.min(W, H) * 0.032;
  for (const it of items) {
    if (it.taken) continue;
    const sx = it.x - scrollX;
    if (sx < -60 || sx > W + 60) continue;
    const iy = it.y + Math.sin(it.bob) * 8;
    if (it.kind === 'friend') {
      // 仲間アイテム（キラキラの光の中のテントウムシ）
      ctx.save();
      const glow = ctx.createRadialGradient(sx, iy, s * 0.2, sx, iy, s * 1.8);
      glow.addColorStop(0, 'rgba(180,230,255,0.9)');
      glow.addColorStop(1, 'rgba(180,230,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(sx, iy, s * 1.8, 0, Math.PI * 2); ctx.fill();
      drawBug('ladybug', sx, iy, s * 1.15, stateTimer * 20);
      ctx.restore();
      // 「なかま」ラベル
      ctx.fillStyle = '#2A6FB0';
      ctx.font = `bold ${s * 0.9}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('なかま', sx, iy - s * 2.1);
    } else {
      // 昆虫ゼリー（カップ）
      ctx.fillStyle = '#FFB84D';
      ctx.beginPath();
      ctx.moveTo(sx - s, iy - s * 0.6);
      ctx.lineTo(sx + s, iy - s * 0.6);
      ctx.lineTo(sx + s * 0.75, iy + s * 0.8);
      ctx.lineTo(sx - s * 0.75, iy + s * 0.8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#FFE0A3';
      ctx.beginPath();
      ctx.ellipse(sx, iy - s * 0.6, s, s * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(sx - s * 0.35, iy, s * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// 仲間の虫を描く共通関数（テントウムシ / ハチ / アリ）
function drawBug(type, x, y, s, wingPhase) {
  ctx.save();
  ctx.translate(x, y);
  const flap = Math.sin(wingPhase);
  if (type === 'bee') {
    // 羽
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.save(); ctx.rotate(-0.6 - flap * 0.4);
    ctx.beginPath(); ctx.ellipse(0, -s * 0.7, s * 0.35, s * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // 体（黄色×黒しま）
    ctx.fillStyle = '#F2C33A';
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.8, s * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3A2A10';
    for (let i = -1; i <= 1; i++) { ctx.fillRect(i * s * 0.35 - s * 0.08, -s * 0.5, s * 0.16, s); }
    ctx.fillStyle = '#2A1C08';
    ctx.beginPath(); ctx.ellipse(s * 0.75, 0, s * 0.28, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'ant') {
    // アリ（黒い3節）
    ctx.fillStyle = '#3A2A22';
    ctx.beginPath(); ctx.ellipse(-s * 0.55, 0, s * 0.5, s * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.34, s * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.5, 0, s * 0.4, s * 0.38, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3A2A22'; ctx.lineWidth = s * 0.08;
    ctx.beginPath(); ctx.moveTo(s * 0.7, -s * 0.2); ctx.lineTo(s * 0.95, -s * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.7, -s * 0.2); ctx.lineTo(s * 0.98, -s * 0.3); ctx.stroke();
  } else {
    // テントウムシ
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.save(); ctx.rotate(-0.5 - flap * 0.4);
    ctx.beginPath(); ctx.ellipse(-s * 0.1, -s * 0.6, s * 0.35, s * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#E23B3B';
    ctx.beginPath(); ctx.arc(0, 0, s * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2A1010'; ctx.lineWidth = s * 0.06;
    ctx.beginPath(); ctx.moveTo(0, -s * 0.7); ctx.lineTo(0, s * 0.7); ctx.stroke();
    ctx.fillStyle = '#2A1010';
    ctx.beginPath(); ctx.arc(s * 0.68, 0, s * 0.3, 0, Math.PI * 2); ctx.fill();   // 頭
    ctx.fillStyle = '#2A1010';
    for (const [dx, dy] of [[-0.28, -0.28], [-0.28, 0.28], [0.15, -0.3], [0.15, 0.3]]) {
      ctx.beginPath(); ctx.arc(dx * s, dy * s, s * 0.11, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawCompanions() {
  const s = Math.min(W, H) * 0.03;
  for (const c of companions) {
    drawBug(c.type, c.x, c.y, s, c.wing);
  }
}

// 道中の敵（スズメバチ）
function drawEnemies() {
  const s = Math.min(W, H) * 0.045;
  for (const e of enemies) {
    const ex = e.x - scrollX;
    if (ex < -s * 3 || ex > W + s * 3) continue;
    ctx.save();
    ctx.translate(ex, e.y);
    const flap = Math.sin(e.wing);
    const flash = e.hurt > 0;
    // 羽（とがった半透明）
    ctx.fillStyle = 'rgba(210,190,255,0.55)';
    for (const sgn of [-1, 1]) {
      ctx.save(); ctx.rotate(sgn * (0.5 + flap * 0.4));
      ctx.beginPath(); ctx.ellipse(sgn * s * 0.2, -s * 0.7, s * 0.3, s * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 針（お尻の毒針）
    ctx.fillStyle = '#2A1030';
    ctx.beginPath();
    ctx.moveTo(-s * 0.95, 0); ctx.lineTo(-s * 1.35, -s * 0.1); ctx.lineTo(-s * 0.95, s * 0.14);
    ctx.closePath(); ctx.fill();
    // 体（濃い紫＋黒しま）
    const g = ctx.createLinearGradient(0, -s * 0.6, 0, s * 0.6);
    g.addColorStop(0, flash ? '#FFFFFF' : '#7A2E6E');
    g.addColorStop(1, flash ? '#FFCFE8' : '#3A1030');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.95, s * 0.62, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = flash ? '#E0A0C0' : '#25101E';
    for (let i = -1; i <= 1; i++) { ctx.fillRect(i * s * 0.4 - s * 0.08, -s * 0.5, s * 0.16, s); }
    // 頭
    ctx.fillStyle = flash ? '#FFFFFF' : '#2A1224';
    ctx.beginPath(); ctx.ellipse(s * 0.85, -s * 0.05, s * 0.4, s * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    // 怒った赤い目
    ctx.fillStyle = '#FF3B4B';
    ctx.shadowColor = '#FF3B4B'; ctx.shadowBlur = s * 0.3;
    ctx.beginPath(); ctx.ellipse(s * 0.92, -s * 0.12, s * 0.16, s * 0.11, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // 牙
    ctx.strokeStyle = '#1A0A16'; ctx.lineWidth = s * 0.07; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 1.15, s * 0.08); ctx.lineTo(s * 1.35, s * 0.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 1.15, s * 0.18); ctx.lineTo(s * 1.28, s * 0.38); ctx.stroke();
    ctx.restore();
  }
}

function drawShots() {
  for (const s of shots) {
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.side === 'player') {
      // 光の弾
      const g = ctx.createRadialGradient(0, 0, s.r * 0.2, 0, 0, s.r * 1.4);
      g.addColorStop(0, '#FFFFFF');
      g.addColorStop(0.5, s.color);
      g.addColorStop(1, 'rgba(255,220,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, s.r * 1.4, 0, Math.PI * 2); ctx.fill();
    } else {
      // ボスのエネルギー弾
      ctx.rotate(s.spin);
      const g = ctx.createRadialGradient(0, 0, s.r * 0.2, 0, 0, s.r * 1.3);
      g.addColorStop(0, '#FFFFFF');
      g.addColorStop(0.4, s.color);
      g.addColorStop(1, 'rgba(255,60,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, s.r * 1.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawGoalFlag() {
  const sx = goalDist - scrollX + W * 0.5;
  if (sx > W + 100) return;
  const groundY = H * 0.88;
  const poleH = H * 0.5;
  ctx.fillStyle = '#888';
  ctx.fillRect(sx - 4, groundY - poleH, 8, poleH);
  // チェック旗
  const fw = Math.min(W, H) * 0.18, fh = fw * 0.62;
  const n = 4;
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < n; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? '#333' : '#FFF';
      ctx.fillRect(sx + 4 + c * fw / n, groundY - poleH + r * fh / 3, fw / n, fh / 3);
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 大あご用のグラデーション
function mandGrad(vs, c0, c1) {
  const g = ctx.createLinearGradient(vs * 1.1, -vs * 0.6, vs * 2.4, vs * 0.4);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  return g;
}
// 片側の大あご（my=-1で上、+1で下）。open=あごの開き具合。
function drawMandible(vs, my, open, fill, stroke) {
  const o = open;
  ctx.beginPath();
  ctx.moveTo(vs * 1.12, my * vs * 0.05);
  // 外側の縁：外へふくらみながら前方へ
  ctx.quadraticCurveTo(vs * 1.75, my * vs * 0.82 * o, vs * 2.3, my * vs * 0.5 * o);
  // 先端が内側へフックする
  ctx.quadraticCurveTo(vs * 2.66, my * vs * 0.24 * o, vs * 2.34, my * vs * 0.04);
  // 内側の先端
  ctx.quadraticCurveTo(vs * 2.12, my * vs * 0.26 * o, vs * 1.96, my * vs * 0.2 * o);
  // 内歯（中心に向かってとがる）
  ctx.lineTo(vs * 1.82, my * vs * 0.0);
  ctx.lineTo(vs * 1.68, my * vs * 0.24 * o);
  // 内側の縁を付け根へ戻す
  ctx.quadraticCurveTo(vs * 1.4, my * vs * 0.1 * o, vs * 1.12, my * vs * 0.0);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = vs * 0.045; ctx.lineJoin = 'round'; ctx.stroke();
}
function drawStar(x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const a2 = a + Math.PI / 5;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBeetle() {
  const b = beetle;
  const s = b.size || Math.min(W, H) * 0.055;
  // 無敵中は点滅
  if (b.invincible > 0 && Math.floor(b.invincible * 10) % 2 === 0) return;

  const p = b.power | 0;                            // 強化レベル（ゼリーの数）
  const GOLD = 10;                                  // この数で全身が金色（最終形態）
  const gold = p >= GOLD;
  const auraLv = Math.min(p / GOLD, 1);             // 0..1（オーラの強さ）
  const grow = 1 + Math.min(p, 12) * 0.016;         // 強化で少し大きく
  const atk = b.atkAnim > 0 ? b.atkAnim / 0.3 : 0;  // 攻撃モーション 1→0
  const chomp = atk > 0 ? 1 - Math.sin((1 - atk) * Math.PI) * 0.72 : 1;   // 開→閉→開
  const lunge = atk > 0 ? Math.sin((1 - atk) * Math.PI) * s * 0.5 : 0;    // 前方へ突き出す

  ctx.save();
  ctx.translate(b.x + lunge, b.y);
  ctx.rotate(b.tilt || 0);
  ctx.scale(grow, grow);

  const vs = s;
  const flap = Math.sin(b.wingPhase);

  // ---- 強化オーラ（パワーアップで体にまとう光。数が増えるほど強く輝く） ----
  if (p >= 1) {
    const pulse = 1 + Math.sin(stateTimer * 4) * 0.06;
    const rad = vs * (1.7 + auraLv * 1.4) * pulse;
    const inner = gold ? 'rgba(255,240,150,0.9)' : `rgba(255,226,140,${0.2 + auraLv * 0.45})`;
    const aura = ctx.createRadialGradient(0, 0, vs * 0.6, 0, 0, rad);
    aura.addColorStop(0, inner);
    aura.addColorStop(0.6, gold ? 'rgba(255,215,90,0.35)' : `rgba(255,220,120,${0.12 + auraLv * 0.2})`);
    aura.addColorStop(1, 'rgba(255,215,90,0)');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fill();
  }

  // ---- 羽（半透明・後ろ） ----
  ctx.fillStyle = 'rgba(255, 236, 179, 0.7)';
  ctx.save(); ctx.rotate(-0.5 - flap * 0.45);
  ctx.beginPath(); ctx.ellipse(-vs * 0.25, -vs * 0.9, vs * 0.5, vs * 1.0, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(-0.2 - flap * 0.35);
  ctx.beginPath(); ctx.ellipse(vs * 0.05, -vs * 0.95, vs * 0.46, vs * 0.9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  // ---- 脚（6本） ----
  ctx.strokeStyle = '#160C05';
  ctx.lineWidth = vs * 0.12;
  ctx.lineCap = 'round';
  for (const lx of [-vs * 0.55, -vs * 0.05, vs * 0.45]) {
    ctx.beginPath();
    ctx.moveTo(lx, vs * 0.45);
    ctx.lineTo(lx - vs * 0.12, vs * 0.82);
    ctx.lineTo(lx - vs * 0.34, vs * 1.02);
    ctx.stroke();
  }
  // 前脚（前方へ）
  ctx.beginPath();
  ctx.moveTo(vs * 0.75, vs * 0.32);
  ctx.lineTo(vs * 1.02, vs * 0.66);
  ctx.lineTo(vs * 1.28, vs * 0.72);
  ctx.stroke();

  // ---- 上翅（エリトラ：細長く光沢のある平たい体。最終形態で金色に） ----
  const bodyGrad = ctx.createLinearGradient(-vs, -vs * 0.6, vs * 0.6, vs * 0.6);
  if (gold) {
    bodyGrad.addColorStop(0, '#FFF4B8');
    bodyGrad.addColorStop(0.5, '#F2C33A');
    bodyGrad.addColorStop(1, '#B8860B');
  } else {
    bodyGrad.addColorStop(0, '#4A2E17');
    bodyGrad.addColorStop(0.5, '#2A1810');
    bodyGrad.addColorStop(1, '#150B04');
  }
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(-vs * 0.12, 0, vs * 1.18, vs * 0.64, 0, 0, Math.PI * 2);
  ctx.fill();
  // エリトラの合わせ目
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = vs * 0.05;
  ctx.beginPath(); ctx.moveTo(-vs * 1.25, 0); ctx.lineTo(vs * 0.5, 0); ctx.stroke();
  // つや
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.ellipse(-vs * 0.4, -vs * 0.28, vs * 0.55, vs * 0.15, -0.22, 0, Math.PI * 2); ctx.fill();

  // ---- 前胸（プロノータム） ----
  const proGrad = ctx.createLinearGradient(0, -vs * 0.5, 0, vs * 0.5);
  if (gold) { proGrad.addColorStop(0, '#FFE58A'); proGrad.addColorStop(1, '#C8931A'); }
  else { proGrad.addColorStop(0, '#3A2211'); proGrad.addColorStop(1, '#150B04'); }
  ctx.fillStyle = proGrad;
  ctx.beginPath(); ctx.ellipse(vs * 0.6, 0, vs * 0.52, vs * 0.56, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.ellipse(vs * 0.5, -vs * 0.26, vs * 0.3, vs * 0.1, -0.2, 0, Math.PI * 2); ctx.fill();

  // ---- 頭 ----
  ctx.fillStyle = gold ? '#C8931A' : '#150B04';
  ctx.beginPath(); ctx.ellipse(vs * 1.12, 0, vs * 0.42, vs * 0.44, 0, 0, Math.PI * 2); ctx.fill();

  // ---- 大あご（クワガタの象徴！ハサミ型。色はパワーで変えず、最終形態のみ金色） ----
  let mandFill, mandStroke;
  if (gold) { mandFill = mandGrad(vs, '#FFF3B0', '#E8A417'); mandStroke = '#8A5E00'; }
  else { mandFill = mandGrad(vs, '#5A3A1E', '#241206'); mandStroke = '#0E0702'; }
  drawMandible(vs, -1, chomp, mandFill, mandStroke);
  drawMandible(vs, 1, chomp, mandFill, mandStroke);

  // ---- 目 ----
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(vs * 1.1, -vs * 0.12, vs * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#161616';
  ctx.beginPath(); ctx.arc(vs * 1.15, -vs * 0.1, vs * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.arc(vs * 1.19, -vs * 0.14, vs * 0.035, 0, Math.PI * 2); ctx.fill();

  // ---- 星のキラキラ（最終形態＝金色のとき） ----
  if (gold) {
    for (let i = 0; i < 4; i++) {
      const a = stateTimer * 2.2 + i * Math.PI * 2 / 4;
      drawStar(Math.cos(a) * vs * 2.0, Math.sin(a) * vs * 1.35, vs * 0.2, '#FFF3A0');
    }
  }

  // ---- 攻撃の衝撃波（前方） ----
  if (atk > 0) {
    const prog = 1 - atk;
    ctx.globalAlpha = Math.max(0, atk * 0.9);
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = vs * 0.16;
    ctx.beginPath();
    ctx.arc(vs * 2.1, 0, vs * (0.7 + prog * 1.5), -1.0, 1.0);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawAttackButton() {
  if (state !== STATE.PLAY && state !== STATE.BOSS) return;
  const b = attackButton();
  const held = attackHeld();
  const ready = beetle.atkCd <= 0;
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.arc(b.x, b.y + b.r * 0.08, b.r, 0, Math.PI * 2); ctx.fill();
  // 本体
  const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.2, b.x, b.y, b.r);
  g.addColorStop(0, ready ? '#FF9A8A' : '#C79088');
  g.addColorStop(1, ready ? '#E8433B' : '#9A5C57');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (held ? 0.92 : 1), 0, Math.PI * 2); ctx.fill();
  // ふち
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = b.r * 0.08;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.98, 0, Math.PI * 2); ctx.stroke();
  // アイコン
  ctx.font = `${b.r * 0.95}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('💥', b.x, b.y - b.r * 0.08);
  // ラベル
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${b.r * 0.4}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
  ctx.fillText('こわす', b.x, b.y + b.r * 0.52);
  // クールダウンのリング
  if (!ready) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = b.r * 0.12;
    ctx.beginPath();
    const frac = 1 - beetle.atkCd / 0.42;
    ctx.arc(b.x, b.y, b.r * 0.72, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
  }
}

function drawMusicButton() {
  if (state === STATE.TITLE) return;   // タイトルでは非表示（タップ開始と紛らわしいため）
  const b = musicButton();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `${b.r * 1.1}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Music.enabled ? '🔊' : '🔇', b.x, b.y + b.r * 0.05);
}

function drawBossBanner() {
  const base = Math.min(W, H);
  const a = Math.min(1, bossBanner / 0.4) * Math.min(1, (2.2 - bossBanner) / 0.3 + 0.3);
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, H * 0.34, W, H * 0.16);
  ctx.fillStyle = '#FF5B6E';
  ctx.font = `bold ${base * 0.11}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = base * 0.014; ctx.lineJoin = 'round';
  ctx.strokeText('ボス とうじょう！', W / 2, H * 0.42);
  ctx.fillText('ボス とうじょう！', W / 2, H * 0.42);
  ctx.restore();
}

// ---------- ボスのロボット ----------
function drawBoss() {
  if (!boss.active) return;
  const S = boss.size;
  ctx.save();
  ctx.translate(boss.x, boss.y);
  // 被弾フラッシュ
  const flash = boss.hurt > 0;

  // 影オーラ
  const aura = ctx.createRadialGradient(0, 0, S * 0.4, 0, 0, S * 1.5);
  aura.addColorStop(0, 'rgba(255,80,120,0.28)');
  aura.addColorStop(1, 'rgba(255,80,120,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, S * 1.5, 0, Math.PI * 2); ctx.fill();

  const metal = (x0, y0, x1, y1, c0, c1) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; };

  // 後方スラスター
  ctx.fillStyle = '#5A6270';
  roundRect(S * 0.55, -S * 0.5, S * 0.5, S, S * 0.15); ctx.fill();
  ctx.fillStyle = '#FF8A3B';
  for (const yy of [-S * 0.28, S * 0.28]) {
    ctx.beginPath(); ctx.ellipse(S * 1.05 + Math.random() * S * 0.1, yy, S * 0.12, S * 0.16, 0, 0, Math.PI * 2); ctx.fill();
  }

  // 肩アーマー
  ctx.fillStyle = metal(0, -S, 0, 0, '#9AA6B4', '#525A68');
  roundRect(-S * 0.75, -S * 0.92, S * 1.3, S * 0.5, S * 0.2); ctx.fill();

  // メインボディ（六角形の装甲）
  ctx.fillStyle = metal(-S * 0.8, -S * 0.8, S * 0.8, S * 0.8, '#8891A0', '#3C4350');
  ctx.beginPath();
  ctx.moveTo(-S * 0.85, -S * 0.55);
  ctx.lineTo(S * 0.55, -S * 0.78);
  ctx.lineTo(S * 0.8, 0);
  ctx.lineTo(S * 0.55, S * 0.78);
  ctx.lineTo(-S * 0.85, S * 0.55);
  ctx.lineTo(-S * 1.0, 0);
  ctx.closePath(); ctx.fill();
  // パネルライン
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = S * 0.03;
  ctx.beginPath(); ctx.moveTo(-S * 0.7, -S * 0.2); ctx.lineTo(S * 0.5, -S * 0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-S * 0.7, S * 0.2); ctx.lineTo(S * 0.5, S * 0.2); ctx.stroke();

  // 胸のコア（光る）
  const coreR = S * 0.26 * (1 + Math.sin(stateTimer * 5) * 0.08);
  const core = ctx.createRadialGradient(-S * 0.1, 0, coreR * 0.2, -S * 0.1, 0, coreR);
  core.addColorStop(0, '#FFFFFF');
  core.addColorStop(0.4, flash ? '#FFF0A0' : '#5BE0FF');
  core.addColorStop(1, flash ? '#FF8A3B' : '#1C7CB0');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(-S * 0.1, 0, coreR, 0, Math.PI * 2); ctx.fill();

  // 頭（バイザーに赤い目）
  ctx.fillStyle = metal(-S * 0.5, -S, -S * 0.5, -S * 0.5, '#AEB8C6', '#4C5462');
  roundRect(-S * 0.55, -S * 1.15, S * 0.7, S * 0.5, S * 0.14); ctx.fill();
  // バイザー
  ctx.fillStyle = '#1A1E28';
  roundRect(-S * 0.5, -S * 1.05, S * 0.6, S * 0.24, S * 0.1); ctx.fill();
  // 赤い目
  ctx.fillStyle = flash ? '#FFF3A0' : '#FF3B4B';
  ctx.shadowColor = '#FF3B4B'; ctx.shadowBlur = S * 0.2;
  ctx.beginPath(); ctx.ellipse(-S * 0.2, -S * 0.93, S * 0.22, S * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // アンテナ
  ctx.strokeStyle = '#AEB8C6'; ctx.lineWidth = S * 0.05;
  ctx.beginPath(); ctx.moveTo(-S * 0.3, -S * 1.15); ctx.lineTo(-S * 0.45, -S * 1.5); ctx.stroke();
  ctx.fillStyle = '#FF3B4B';
  ctx.beginPath(); ctx.arc(-S * 0.45, -S * 1.53, S * 0.07, 0, Math.PI * 2); ctx.fill();

  // 左腕の大砲（プレイヤー側＝画面左を向く）
  ctx.fillStyle = metal(-S, 0, -S * 1.6, 0, '#6B7482', '#39404C');
  roundRect(-S * 1.55, -S * 0.34, S * 0.75, S * 0.68, S * 0.16); ctx.fill();
  ctx.fillStyle = '#20242E';
  ctx.beginPath(); ctx.ellipse(-S * 1.5, 0, S * 0.14, S * 0.26, 0, 0, Math.PI * 2); ctx.fill();
  // 砲口の光（発射前の予兆）
  if (boss.introT <= 0 && boss.fireCd < 0.4 && !boss.defeated) {
    ctx.fillStyle = 'rgba(255,90,110,0.8)';
    ctx.beginPath(); ctx.arc(-S * 1.55, 0, S * 0.16 * (1 - boss.fireCd / 0.4), 0, Math.PI * 2); ctx.fill();
  }

  // 被弾で白フラッシュ
  if (flash) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, S * 0.95, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawHUD() {
  if (state !== STATE.PLAY && state !== STATE.GOAL && state !== STATE.RETRY && state !== STATE.BOSS) return;
  const pad = Math.min(W, H) * 0.03;
  const hs = Math.min(W, H) * 0.04;

  // HUDの下地（障害物と重なっても見やすいように）
  const panelH = companions.length > 0 ? hs * 6.0 : hs * 4.4;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  roundRect(pad * 0.4, pad * 0.4, hs * 2.3 * MAX_HEARTS + pad, panelH, hs * 0.6);
  ctx.fill();

  // ハート
  for (let i = 0; i < MAX_HEARTS; i++) {
    drawHeart(pad + hs + i * hs * 2.3, pad + hs, hs, i < hearts ? '#FF5B6E' : 'rgba(0,0,0,0.15)');
  }

  // ゼリー数
  const jx = pad + hs, jy = pad + hs * 3.2;
  ctx.fillStyle = '#FFB84D';
  ctx.beginPath();
  ctx.moveTo(jx - hs * 0.7, jy - hs * 0.4);
  ctx.lineTo(jx + hs * 0.7, jy - hs * 0.4);
  ctx.lineTo(jx + hs * 0.5, jy + hs * 0.6);
  ctx.lineTo(jx - hs * 0.5, jy + hs * 0.6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#5C3317';
  ctx.font = `bold ${hs * 1.5}px sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('× ' + jellies, jx + hs * 1.2, jy + hs * 0.1);

  if (state === STATE.BOSS) {
    // ボスのHPバー（ステータス欄の下に配置）
    const bw = W * 0.56, bh = Math.min(W, H) * 0.028;
    const bx = W / 2 - bw / 2, by = pad * 0.4 + panelH + bh * 1.4;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${bh * 1.1}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ボス', W / 2, by - bh * 0.9);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
    const hpFrac = Math.max(0, boss.hp / boss.maxHp);
    const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    hg.addColorStop(0, '#FF3B4B'); hg.addColorStop(1, '#FF9A5B');
    ctx.fillStyle = hg;
    if (hpFrac > 0) { roundRect(bx, by, Math.max(bh, bw * hpFrac), bh, bh / 2); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = bh * 0.14;
    roundRect(bx, by, bw, bh, bh / 2); ctx.stroke();
  } else {
    // 進捗バー
    const bw = W * 0.5, bh = Math.min(W, H) * 0.02;
    const bx = W / 2 - bw / 2, by = pad + bh;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    roundRect(bx, by, bw, bh, bh / 2);
    ctx.fill();
    const prog = Math.min(1, scrollX / goalDist);
    ctx.fillStyle = '#6BCB77';
    roundRect(bx, by, Math.max(bh, bw * prog), bh, bh / 2);
    ctx.fill();
    // 旗アイコン
    ctx.font = `${bh * 2.2}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('🏁', bx + bw + bh * 1.8, by + bh * 0.6);
    // 進捗マーカー
    ctx.fillStyle = '#4A2C12';
    ctx.beginPath();
    ctx.arc(bx + bw * prog, by + bh / 2, bh * 1.1, 0, Math.PI * 2);
    ctx.fill();
  }

  // 仲間の数
  if (companions.length > 0) {
    ctx.fillStyle = '#2A6FB0';
    ctx.font = `bold ${hs * 1.1}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('なかま ×' + companions.length, jx - hs * 0.6, jy + hs * 1.9);
  }
}

function drawHeart(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.7);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.2, x - s * 0.5, y - s * 0.9, x, y - s * 0.25);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 0.9, x + s * 1.1, y - s * 0.2, x, y + s * 0.7);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function overlay(alpha) {
  ctx.fillStyle = `rgba(80, 60, 30, ${alpha})`;
  ctx.fillRect(0, 0, W, H);
}

function bigText(text, y, size, color, stroke) {
  ctx.font = `bold ${size}px 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', 'Yu Gothic', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = size * 0.15;
    ctx.lineJoin = 'round';
    ctx.strokeText(text, W / 2, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
}

function pulse() { return 1 + Math.sin(stateTimer * 4) * 0.05; }

function drawTitle() {
  const base = Math.min(W, H);
  bigText('クワガタ', H * 0.2, base * 0.13, '#5C3317', '#FFF');
  bigText('フライング！', H * 0.33, base * 0.13, '#5C3317', '#FFF');
  ctx.save();
  ctx.translate(W / 2, H * 0.72);
  ctx.scale(pulse(), pulse());
  ctx.translate(-W / 2, -H * 0.72);
  bigText('がめんを タッチしてね！', H * 0.72, base * 0.055, '#FFF', '#E8743B');
  ctx.restore();
  bigText('おしてるあいだ うえにとぶよ', H * 0.82, base * 0.036, '#5C3317', '#FFF');
  bigText('みぎした の ボタンで こわせる！', H * 0.875, base * 0.036, '#5C3317', '#FFF');
  bigText('なかまを あつめて ボスをたおそう！', H * 0.93, base * 0.036, '#5C3317', '#FFF');
}

function drawGoal() {
  overlay(0.25);
  const base = Math.min(W, H);
  const won = boss.defeated;
  bigText(won ? '🏆 クリア！ 🏆' : '🎉 ゴール！ 🎉', H * 0.28, base * 0.11, '#FFD93D', '#B8860B');
  bigText(won ? 'ボスをたおした！' : 'やったね！すごい！', H * 0.44, base * 0.07, '#FFF', '#E8743B');
  bigText('ゼリー ' + jellies + 'こ ／ なかま ' + companions.length + 'ひき', H * 0.57, base * 0.05, '#FFE0A3', '#8B5A2B');
  if (stateTimer > 0.6) {
    ctx.save();
    ctx.translate(W / 2, H * 0.75);
    ctx.scale(pulse(), pulse());
    ctx.translate(-W / 2, -H * 0.75);
    bigText('タッチで もういっかい！', H * 0.75, base * 0.05, '#FFF', '#4D96FF');
    ctx.restore();
  }
}

function drawRetry() {
  overlay(0.25);
  const base = Math.min(W, H);
  bigText('あちゃー！', H * 0.32, base * 0.1, '#FFF', '#E8743B');
  bigText('でも だいじょうぶ！', H * 0.46, base * 0.06, '#FFF', '#5C3317');
  if (stateTimer > 0.6) {
    ctx.save();
    ctx.translate(W / 2, H * 0.68);
    ctx.scale(pulse(), pulse());
    ctx.translate(-W / 2, -H * 0.68);
    bigText('タッチで もういっかい！', H * 0.68, base * 0.055, '#FFF', '#4D96FF');
    ctx.restore();
  }
}

function drawConfettiLayer() {
  if (state !== STATE.GOAL) return;
  for (const c of confetti) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.r, -c.r * 0.6, c.r * 2, c.r * 1.2);
    ctx.restore();
  }
}

// ---------- メインループ ----------
started = true;
if (W < 10 || H < 10) resize();   // まだサイズ未確定なら確定させる
resetGame();
state = STATE.TITLE;
stateTimer = 0;

let lastTime = 0;
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  if (W >= 10 && H >= 10) {   // 有効なサイズが取れている時だけ描画
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 開発時の動作確認用（?debug 付きURLのときだけ有効）
if (typeof location !== 'undefined' && location.search.indexOf('debug') >= 0) {
  window.__kuwagata = {
    beetle, boss,
    doAttack,
    play() { resetGame(); state = STATE.PLAY; stateTimer = 1; },
    setPower(n) { jellies = n; beetle.power = n; },
    addFriend() { addCompanion(); },
    gotoBoss() { resetGame(); state = STATE.PLAY; startBoss(); },
    hurtBoss(n) { boss.hp -= (n || 1); if (boss.hp <= 0) bossDefeated(); },
    toggleMusic() { return Music.toggle(); },
    musicOn() { return Music.enabled; },
    addObstacleAhead() {
      obstacles.push({ x: scrollX + beetle.x + beetle.size * 3, type: 'bottom', h: H * 0.3, w: Math.max(W, H) * 0.055, passed: false });
    },
    addEnemyAhead(y) {
      enemies.push({ x: scrollX + W * 0.7, y: y || H * 0.4, baseY: y || H * 0.4, hp: 3, maxHp: 3, fireCd: 0.2, bob: 0, hurt: 0, wing: 0 });
    },
    enemyFireAll() { for (const e of enemies) enemyFire(e.x - scrollX, e.y); },
    get state() { return state; },
    get hearts() { return hearts; },
    get companionCount() { return companions.length; },
    get enemyCount() { return enemies.length; },
    get shotCount() { return shots.length; },
    get enemyShotCount() { return shots.filter(s => s.side === 'enemy').length; },
    get obstacleCount() { return obstacles.length; }
  };
}

})();
</script>
